<script data-src="js/gl.js">
/*
  Small WebGL2 helpers: compile programs, make render targets, draw quads.
  Nothing scene-specific lives here.
*/
(function () {
  const LB = (window.LB = window.LB || {});

  const HEADER = "#version 300 es\nprecision highp float;\nprecision highp int;\n";

  // Starts compiling and linking without waiting for the result.
  function start(gl, vert, frag, label) {
    const p = gl.createProgram();
    const vs = gl.createShader(gl.VERTEX_SHADER);
    const fs = gl.createShader(gl.FRAGMENT_SHADER);
    gl.shaderSource(vs, HEADER + vert);
    gl.shaderSource(fs, HEADER + frag);
    gl.compileShader(vs);
    gl.compileShader(fs);
    gl.attachShader(p, vs);
    gl.attachShader(p, fs);
    gl.bindAttribLocation(p, 0, "aPos");
    gl.linkProgram(p);
    return { p, vs, fs, label };
  }

  // Checks a started program and returns { prog, u } where u maps uniform names to locations (looked up lazily).
  function finish(gl, job) {
    const { p, vs, fs, label } = job;
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
      const log = [vs, fs].map((s) => gl.getShaderInfoLog(s)).filter(Boolean).join("\n") || gl.getProgramInfoLog(p);
      throw new Error(`Program "${label}" failed:\n${log}`);
    }
    gl.deleteShader(vs);
    gl.deleteShader(fs);
    const cache = {};
    const u = new Proxy(cache, {
      get(target, name) {
        if (!(name in target)) target[name] = gl.getUniformLocation(p, name);
        return target[name];
      },
    });
    return { prog: p, u };
  }

  function program(gl, vert, frag, label) {
    return finish(gl, start(gl, vert, frag, label));
  }

  // Compiles several programs at once. With KHR_parallel_shader_compile the
  // driver works on them in parallel while the page stays responsive.
  async function programs(gl, list) {
    const ext = gl.getExtension("KHR_parallel_shader_compile");
    const jobs = list.map(([vert, frag, label]) => start(gl, vert, frag, label));
    if (ext) {
      while (!jobs.every((j) => gl.getProgramParameter(j.p, ext.COMPLETION_STATUS_KHR))) {
        await new Promise((r) => setTimeout(r, 16));
      }
    }
    return jobs.map((j) => finish(gl, j));
  }

  function texture(gl, w, h, opts = {}) {
    const t = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, opts.data || null);
    const filter = opts.nearest ? gl.NEAREST : gl.LINEAR;
    const wrap = opts.repeat ? gl.REPEAT : gl.CLAMP_TO_EDGE;
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filter);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, wrap);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, wrap);
    return t;
  }

  // A texture plus a framebuffer that renders into it.
  function target(gl, w, h, opts) {
    w = Math.max(1, Math.round(w));
    h = Math.max(1, Math.round(h));
    const tex = texture(gl, w, h, opts);
    const fb = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    return { tex, fb, w, h };
  }

  function freeTarget(gl, t) {
    if (!t) return;
    gl.deleteFramebuffer(t.fb);
    gl.deleteTexture(t.tex);
  }

  // One unit quad (0..1) shared by every draw. Vertex shaders map it where it needs to go.
  function quad(gl) {
    const vao = gl.createVertexArray();
    gl.bindVertexArray(vao);
    const buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([0, 0, 1, 0, 0, 1, 1, 1]), gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
    gl.bindVertexArray(null);
    return vao;
  }

  function bindTarget(gl, t) {
    if (t) {
      gl.bindFramebuffer(gl.FRAMEBUFFER, t.fb);
      gl.viewport(0, 0, t.w, t.h);
    } else {
      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
      gl.viewport(0, 0, gl.drawingBufferWidth, gl.drawingBufferHeight);
    }
  }

  function bindTex(gl, unit, tex) {
    gl.activeTexture(gl.TEXTURE0 + unit);
    gl.bindTexture(gl.TEXTURE_2D, tex);
  }

  // "#7a4b9c" -> [r, g, b] in 0..1
  function rgb(hex) {
    const n = parseInt(hex.replace("#", ""), 16);
    return [((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255];
  }

  // Full-screen pass vertex shader: the unit quad covers the target, vUv is 0..1.
  const FULLSCREEN_VERT = `
in vec2 aPos;
out vec2 vUv;
void main() { vUv = aPos; gl_Position = vec4(aPos * 2.0 - 1.0, 0.0, 1.0); }`;

  LB.gl = { program, programs, texture, target, freeTarget, quad, bindTarget, bindTex, rgb, FULLSCREEN_VERT };
})();

</script>
<script data-src="js/clock.js">
/*
  The stepped clock. Rendering runs at the display's rate, but anything that
  animates reads its time from here, and that time only moves on the
  stop-motion beat (12, 8 or 6 times a second). Between beats the pose holds,
  the way a stop-motion frame holds on screen for 2, 3 or 4 video frames.

  Every animation period is a whole fraction of LOOP seconds, and boil cycles
  through a few fixed seeds, so the whole scene repeats exactly every LOOP
  seconds at any of the three rates. That's what makes a seamless video loop
  possible later.
*/
(function () {
  const LB = (window.LB = window.LB || {});

  const LOOP = 6; // seconds; 72, 48 or 36 beats
  const BOIL_SEEDS = 3; // like redrawing every drawing three times and cycling them

  function createClock(fps) {
    let seconds = 0; // play time, frozen while paused
    return {
      fps,
      get loop() { return LOOP; },
      advance(dt) { seconds = (((seconds + dt) % LOOP) + LOOP) % LOOP; },
      set(t) { seconds = ((t % LOOP) + LOOP) % LOOP; },
      get seconds() { return seconds; },
      // The beat index within the loop and the quantized time it stands for.
      get beat() { return Math.floor(seconds * this.fps + 1e-6); },
      get beatTime() { return this.beat / this.fps; },
      get boilSeed() { return this.beat % BOIL_SEEDS; },
    };
  }

  LB.createClock = createClock;
  LB.LOOP = LOOP;
  LB.BOIL_SEEDS = BOIL_SEEDS;
})();

</script>
<script data-src="js/materials.js">
/*
  The procedural material library, shared by every bake shader.

  A "bake" renders one layer or sprite of a scene into a texture, once, at
  load. These functions are what make the baked art read as handmade: noise
  for uneven edges, fibers for felt, domed tufts for clumped foliage, grain
  for paper, dents for clay, beads, and one consistent light from the top left.

  Coordinates are scene units: y runs 0 (top) to 1 (bottom), x runs 0 to
  16/9. uPx is the size of one texture pixel in scene units, so anything
  "one pixel wide" stays one pixel wide at any bake resolution.

  Note for anyone editing: the Windows shader compiler inlines every call,
  so a function called in five places is compiled five times. Shaders that
  draw many things loop over them with a uniform count and call each
  function once.
*/
(function () {
  const LB = (window.LB = window.LB || {});

  LB.MATERIALS_GLSL = `
#define PI 3.14159265
uniform vec4 uRect;   // scene rect this texture covers: x0, y0, x1, y1
uniform vec2 uRes;    // texture size in px
uniform float uPx;    // scene units per texture px
uniform float uSeed;  // varies per bake so repeated elements differ
uniform float uFrame; // frame index for cycle animations
uniform int uN;       // a count for shaders that loop over several things (a uniform, so the loop isn't unrolled)
uniform int uOne;     // always 1; used as a loop bound so the compiler keeps small loops as loops
uniform vec4 uXf;     // the item's own transform: move x, move y, scale, rotation (radians)
uniform vec2 uXfOrigin; // the point the item scales and rotates around (its center before moving)
out vec4 outColor;

// Texture row 0 holds the top of the rect, so the compositor samples without flips.
// The result is in the item's own coordinates: the item's transform is undone here, so every
// shader can be moved, scaled and rotated without knowing about it.
vec2 scenePos() {
  vec2 d = mix(uRect.xy, uRect.zw, gl_FragCoord.xy / uRes) - uXfOrigin - uXf.xy;
  float c = cos(uXf.w), s = sin(uXf.w);
  return uXfOrigin + vec2(c * d.x + s * d.y, -s * d.x + c * d.y) / uXf.z;
}

// ---- noise ----
float hash12(vec2 p) {
  vec3 p3 = fract(vec3(p.xyx) * 0.1031);
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.x + p3.y) * p3.z);
}
vec2 hash22(vec2 p) {
  vec3 p3 = fract(vec3(p.xyx) * vec3(0.1031, 0.1030, 0.0973));
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.xx + p3.yz) * p3.zy);
}
float vnoise(vec2 p) {
  vec2 i = floor(p), f = fract(p);
  vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash12(i), hash12(i + vec2(1, 0)), u.x),
             mix(hash12(i + vec2(0, 1)), hash12(i + vec2(1, 1)), u.x), u.y);
}
// Value noise that repeats every "period" lattice cells, for seamless cycles.
float vnoiseP(vec2 p, vec2 period) {
  vec2 i = floor(p), f = fract(p);
  vec2 u = f * f * (3.0 - 2.0 * f);
  vec2 a = mod(i, period), b = mod(i + 1.0, period);
  return mix(mix(hash12(a), hash12(vec2(b.x, a.y)), u.x),
             mix(hash12(vec2(a.x, b.y)), hash12(b), u.x), u.y);
}
const mat2 ROT = mat2(1.6, 1.2, -1.2, 1.6);
float fbm(vec2 p) {
  float s = 0.0, a = 0.5;
  for (int i = 0; i < 5; i++) { s += a * vnoise(p); p = ROT * p; a *= 0.5; }
  return s / 0.97;
}
float fbm3(vec2 p) {
  float s = 0.0, a = 0.5;
  for (int i = 0; i < 3; i++) { s += a * vnoise(p); p = ROT * p; a *= 0.5; }
  return s / 0.875;
}
// Nearest feature point: returns distance; toCenter points from p to the cell's center; id is a per-cell random pair.
float voronoi(vec2 p, out vec2 toCenter, out vec2 id) {
  vec2 n = floor(p), f = fract(p);
  float md = 8.0;
  toCenter = vec2(0.0);
  id = vec2(0.0);
  for (int j = -uOne; j <= uOne; j++)
  for (int i = -uOne; i <= uOne; i++) {
    vec2 g = vec2(float(i), float(j));
    vec2 o = hash22(n + g);
    vec2 r = g + o - f;
    float d = dot(r, r);
    if (d < md) { md = d; toCenter = r; id = hash22(n + g + 17.0); }
  }
  return sqrt(md);
}

// ---- shape helpers (signed distances in scene units, negative inside) ----
float sdEllipse(vec2 p, vec2 c, vec2 r, float ang) {
  vec2 d = p - c;
  float cs = cos(ang), sn = sin(ang);
  d = vec2(cs * d.x + sn * d.y, -sn * d.x + cs * d.y);
  return (length(d / r) - 1.0) * min(r.x, r.y);
}
float sdSegment(vec2 p, vec2 a, vec2 b, float r) {
  vec2 pa = p - a, ba = b - a;
  float h = clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0);
  return length(pa - ba * h) - r;
}
float smin(float a, float b, float k) {
  float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0);
  return mix(b, a, h) - k * h * (1.0 - h);
}
vec2 bez(vec2 a, vec2 b, vec2 c, float t) { return mix(mix(a, b, t), mix(b, c, t), t); }
// Distance to a quadratic bezier, as 16 straight segments; tOut is where the closest point sits.
float sdBezier(vec2 p, vec2 a, vec2 b, vec2 c, out float tOut) {
  float best = 1e9;
  tOut = 0.0;
  vec2 prev = a;
  for (int i = 1; i <= 16 * uOne; i++) {
    float t = float(i) / 16.0;
    vec2 q = bez(a, b, c, t);
    vec2 pa = p - prev, ba = q - prev;
    float h = clamp(dot(pa, ba) / max(dot(ba, ba), 1e-9), 0.0, 1.0);
    float d = length(pa - ba * h);
    if (d < best) { best = d; tOut = t - (1.0 - h) / 16.0; }
    prev = q;
  }
  return best;
}

// Coverage from a signed distance, with a soft one-pixel edge.
float fill(float d) { return clamp(0.5 - d / (1.2 * uPx), 0.0, 1.0); }
// Handmade edge: wobble the distance with noise so nothing is a clean curve.
float wobble(vec2 p, float scale, float amount) { return (fbm3(p * scale + uSeed * 7.1) - 0.5) * amount; }

// Paint "c" with coverage "a" over what's been painted so far (premultiplied).
void over(inout vec4 acc, vec3 c, float a) { acc = vec4(c * a, a) + acc * (1.0 - a); }

// ---- materials ----
// Felt and wool: short fibers lying in three directions.
float fibers(vec2 p) {
  float s = 0.0;
  for (int i = 0; i < 3 * uOne; i++) {
    float a = float(i) * 2.1 + 0.4;
    vec2 q = mat2(cos(a), sin(a), -sin(a), cos(a)) * p;
    s += smoothstep(0.55, 0.95, vnoise(q * vec2(1.0, 7.0) + float(i) * 13.0));
  }
  return s / 3.0;
}
// Fiber noise at a fixed size on screen (about 1.5 px per fiber).
float fuzz(vec2 p) { return fibers(p / uPx * 0.35); }
// Paper grain, about two px per grain whatever the bake size.
float paper(vec2 p) {
  vec2 q = p / uPx;
  return 0.6 * vnoise(q * 0.5) + 0.4 * vnoise(q * 0.17 + 9.0);
}
// Brush strokes running mostly sideways.
float brush(vec2 p, float scale) {
  return vnoise(vec2(p.x * scale, p.y * scale * 14.0) + fbm3(p * scale * 0.5) * 3.0);
}

// ---- light ----
// One warm key from the top left, a cool fill from the right, soft ambient.
// A flat surface comes out close to its albedo.
const vec3 KEY_DIR = vec3(-0.53, -0.62, 0.58);
const vec3 FILL_DIR = vec3(0.72, 0.36, 0.6);
vec3 lit(vec3 albedo, vec3 n, float ao) {
  n = normalize(n);
  float k = max(dot(n, normalize(KEY_DIR)), 0.0);
  float f = max(dot(n, normalize(FILL_DIR)), 0.0);
  vec3 light = vec3(0.36) * ao + k * vec3(1.0, 0.93, 0.82) * 0.86 + f * vec3(0.72, 0.76, 1.0) * 0.26;
  return albedo * light;
}

// Clumped foliage (model-railroad clumps, lichen, teased wool): irregular
// tufts with fuzzy fibers and dark gaps. "height" (0..1) lets callers bump
// the silhouette with the tufts.
vec3 foliage(vec2 p, vec3 shadow, vec3 mid, vec3 light, vec3 tip, float scale, out float height) {
  vec2 q = p * scale + uSeed * 3.0;
  q += vec2(fbm3(q * 0.35), fbm3(q * 0.35 + 7.0)) * 0.9; // warp so the tufts don't line up in cells
  vec2 tc, id;
  float d = voronoi(q, tc, id);
  float r = 0.5 + 0.3 * id.x;
  float h = pow(max(1.0 - (d * d) / (r * r), 0.0), 0.6);
  vec2 tc2, id2;
  float d2 = voronoi(q * 2.6 + 5.0, tc2, id2);
  float h2 = pow(max(1.0 - d2 * d2 / 0.3, 0.0), 0.6);
  float fib = fibers(q * 4.0);
  height = clamp(h * 0.7 + h2 * 0.35 * h + (fib - 0.5) * 0.3, 0.0, 1.0);
  vec3 n = normalize(vec3(-tc * 1.3 - tc2 * 0.5 + (fib - 0.5) * 0.6, max(h, 0.2)));
  vec3 alb = mix(mid, light, clamp(id.y * 0.7 + fib * 0.5 - 0.1, 0.0, 1.0));
  alb *= 0.9 + 0.2 * id2.x;
  alb = mix(alb, tip, smoothstep(0.55, 1.0, h2 * h) * (0.25 + 0.55 * id.x));
  vec3 c = lit(alb, n, 0.35 + 0.65 * h);
  return mix(shadow, c, smoothstep(0.05, 0.4, height));
}

// Beads or tiny flowers scattered over a surface; "size" is in cell units.
vec3 specks(vec2 p, vec3 base, float scale, float density, vec3 c1, vec3 c2, float size) {
  vec2 tc, id;
  float d = voronoi(p * scale + 31.0 + uSeed, tc, id);
  float r = size * (0.7 + 0.6 * id.x);
  float on = step(id.y, density) * (1.0 - smoothstep(r * 0.6, r, d));
  vec3 col = mix(c1, c2, step(0.5, fract(id.x * 7.0)));
  col = lit(col, vec3(-tc / max(r, 0.01) * 0.9, 0.7), 1.0);
  return mix(base, col, on);
}

// A flowered carpet (flocking with beads): mottled base, soft clumps, two sizes of specks.
vec3 carpet(vec2 p, vec3 dark, vec3 light, float topY, float scale, vec3 c1, vec3 c2, float density) {
  vec2 tc, id;
  float d = voronoi(p * scale * vec2(1.0, 1.3), tc, id);
  float h = smoothstep(0.9, 0.1, d);
  vec3 alb = mix(light, dark, smoothstep(0.0, 0.1, p.y - topY));
  alb *= 0.85 + 0.25 * fbm3(p * scale * 0.4) + 0.1 * id.x;
  vec3 c = lit(alb, vec3(-tc * 0.5, 1.0), 0.75 + 0.25 * h);
  c *= 0.9 + 0.2 * fuzz(p);
  c = specks(p, c, scale * 4.0, density, c1, c2, 0.33);
  return specks(p + 0.37, c, scale * 7.0, density * 0.7, c2, c1 * 0.9 + 0.1, 0.3);
}

// Sculpted and painted bark: vertical streaks, grooves, knots, fingerprint dents.
// u runs 0..1 across the trunk for the round shading.
vec3 bark(vec2 p, vec3 base, float u) {
  float uc = clamp(u, 0.0, 1.0);
  vec3 n = normalize(vec3((uc - 0.5) * 3.0, 0.0, 1.0));
  float streak = vnoise(vec2(p.x * 220.0, p.y * 7.0));
  float streak2 = vnoise(vec2(p.x * 90.0 + 4.0, p.y * 3.0));
  float groove = smoothstep(0.62, 0.85, vnoise(vec2(p.x * 120.0 + 3.0, p.y * 4.0)));
  vec3 alb = base * (0.72 + 0.5 * streak * streak2) * (1.0 - 0.45 * groove);
  alb = mix(alb, base * vec3(1.25, 1.15, 1.35), smoothstep(0.7, 0.9, streak) * 0.5); // pale painted highlights
  alb *= 0.92 + 0.14 * fbm3(p * 80.0);
  float edge = 1.0 - pow(abs(uc - 0.5) * 2.0, 3.0);
  return lit(alb, n, 0.5 + 0.5 * edge);
}

// Painted clay: soft horizontal strata and thumb-smoothed dents.
vec3 clay(vec2 p, vec3 dark, vec3 light, float ao) {
  float s = vnoise(vec2(p.x * 7.0, p.y * 55.0));
  float s2 = vnoise(vec2(p.x * 7.0, (p.y + 0.004) * 55.0));
  float dent = fbm3(p * 45.0);
  float dentX = fbm3(p * 45.0 + vec2(0.01, 0.0));
  vec3 n = normalize(vec3((dentX - dent) * 6.0, (s2 - s) * 3.0 - 0.15, 1.0));
  vec3 alb = mix(dark, light, s * 0.6 + dent * 0.4);
  return lit(alb, n, ao);
}
`;
})();

</script>
<script data-src="js/elements.js">
/*
  Reusable art elements. A layer's "paint" list is drawn into its texture
  in order, one draw per element, blended over what's already there. Any
  scene can use these; only the numbers change.

    canopy    round lobes covered in clumped foliage, optional beads
    florets   round lobes covered in tiny four-petal flowers (hydrangea)
    trunk     a sculpted, painted trunk with a flared base
    branch    a straight limb
    turf      ground under a line through up to 8 points: grass or a flowered carpet
    fuzz      a fuzzy felt ball

  Sprites (flowers and leaves that sway) have their own shader at the bottom:
  petals are a list the shader loops over, so one shader covers daisies,
  tulips, orchids and open blooms.

  Each element has a GLSL body, a function that sets its uniforms, and a
  bounding box so its draw only touches the pixels it can cover.
*/
(function () {
  const LB = (window.LB = window.LB || {});
  const rgb = (h) => LB.gl.rgb(h);

  const LOBES = `
uniform vec3 uLobes[8];
uniform int uLobeCount;
uniform float uMerge;
// Smooth union of the lobes; "big" and "bigN" describe the lobe the point sits deepest in.
float lobes(vec2 p, out float big, out vec2 bigN) {
  float d = 1e9;
  big = 0.0;
  bigN = vec2(0.0, -1.0);
  for (int i = 0; i < uLobeCount; i++) {
    vec3 l = uLobes[i];
    float r = length(p - l.xy);
    d = smin(d, r - l.z, uMerge);
    float h = sqrt(max(1.0 - (r * r) / (l.z * l.z), 0.0));
    if (h > big) { big = h; bigN = (p - l.xy) / l.z; }
  }
  return d;
}
// A silhouette edge broken up by fibers over a few px.
float fuzzyEdge(float d, vec2 p, float amount) {
  return clamp(0.5 - (d + (fuzz(p) - 0.5) * amount * uPx) / (1.6 * uPx), 0.0, 1.0);
}`;

  const CANOPY = LOBES + `
uniform vec3 uShadow, uMid, uLight, uTip, uTip2;
uniform float uScale;
uniform vec2 uTipBand;   // above y = x the tips shift toward uTip2, over a fade of y (0 = off)
uniform vec4 uSpeck;     // scale, density, size, on
uniform vec3 uSpeckA, uSpeckB;
void main() {
  vec2 p = scenePos();
  float big;
  vec2 bigN;
  float d = lobes(p, big, bigN);
  if (d > 0.04) { outColor = vec4(0.0); return; }
  vec3 tip = uTipBand.y > 0.0 ? mix(uTip, uTip2, smoothstep(uTipBand.x + uTipBand.y, uTipBand.x, p.y)) : uTip;
  float th;
  vec3 c = foliage(p, uShadow, uMid, uLight, tip, uScale, th);
  if (uSpeck.w > 0.5) c = specks(p, c, uSpeck.x, uSpeck.y, uSpeckA, uSpeckB, uSpeck.z);
  d -= (th - 0.45) * 1.2 / uScale + wobble(p, 16.0, 0.014);
  float a = fuzzyEdge(d, p, 4.0);
  vec3 nBig = normalize(vec3(bigN * 1.1, max(big, 0.25)));
  float shade = clamp(dot(nBig, normalize(KEY_DIR)) * 0.85 + 0.42, 0.32, 1.25);
  outColor = vec4(c * shade * a, a);
}`;

  const FLORETS = LOBES + `
uniform vec3 uC1, uC2, uGap;
uniform float uScale;
void main() {
  vec2 p = scenePos();
  float big;
  vec2 bigN;
  float d = lobes(p, big, bigN);
  if (d > 0.03) { outColor = vec4(0.0); return; }
  vec2 tc, id;
  vec2 q = p * uScale + uSeed * 5.0;
  q += (vec2(vnoise(q * 0.5), vnoise(q * 0.5 + 3.0)) - 0.5) * 0.6;
  float v = voronoi(q, tc, id);
  float ang = atan(tc.y, tc.x);
  float petals = 0.62 + 0.38 * cos(ang * 4.0 + id.y * 6.283);
  float h = smoothstep(0.78 * petals, 0.2 * petals, v);
  vec3 alb = mix(uC1, uC2, id.x) * (0.9 + 0.2 * fuzz(p));
  vec3 c = lit(alb, vec3(-tc * 0.7, 1.0), 0.65 + 0.35 * h);
  c *= 1.0 - 0.3 * smoothstep(0.12, 0.0, v); // tiny eye in each floret
  c = mix(uGap, c, h);
  d -= (h - 0.5) * 0.6 / uScale + wobble(p, 22.0, 0.016);
  float a = fuzzyEdge(d, p, 2.5);
  vec3 nBig = normalize(vec3(bigN, max(big, 0.3)));
  float shade = clamp(dot(nBig, normalize(KEY_DIR)) * 0.3 + 0.8, 0.6, 1.1);
  outColor = vec4(c * shade * a, a);
}`;

  const TRUNK = `
uniform vec4 uTrunk;   // center x, bend, half width, flare at the base
uniform vec2 uSpan;    // top y, bottom y
uniform vec3 uColor;
void main() {
  vec2 p = scenePos();
  float t = clamp((p.y - uSpan.x) / (uSpan.y - uSpan.x), 0.0, 1.0);
  float c = uTrunk.x + uTrunk.y * sin(t * 2.4);
  float w = uTrunk.z * (1.0 + 0.12 * sin(t * 7.0 + uTrunk.x * 10.0)) + uTrunk.w * pow(t, 4.0);
  float u = (p.x - c) / w * 0.5 + 0.5;
  float d = max(abs(p.x - c) - w, uSpan.x - p.y) + wobble(p, 40.0, 0.004);
  outColor = vec4(0.0);
  over(outColor, bark(p, uColor, u), fill(d));
}`;

  const BRANCH = `
uniform vec2 uA, uB;
uniform float uR;
uniform vec3 uColor;
void main() {
  vec2 p = scenePos();
  vec2 ba = uB - uA;
  float h = clamp(dot(p - uA, ba) / dot(ba, ba), 0.0, 1.0);
  vec2 side = normalize(vec2(-ba.y, ba.x));
  float r = uR * (1.0 - 0.35 * h);
  float across = dot(p - uA - ba * h, side) / r;
  float d = length(p - uA - ba * h) - r + wobble(p, 40.0, 0.003);
  outColor = vec4(0.0);
  over(outColor, bark(p, uColor, across * 0.5 + 0.5), fill(d));
}`;

  const TURF = `
uniform vec2 uPts[8];
uniform int uPtCount;
uniform vec3 uTop, uBottom;
uniform float uFade, uStyle, uScale;   // style 0: grass, 1: flowered carpet
uniform vec4 uSpeck;                   // scale, density, size, on
uniform vec3 uSpeckA, uSpeckB;
void main() {
  vec2 p = scenePos();
  vec2 first = uPts[0], last = uPts[uPtCount - 1];
  float top = first.y;
  for (int i = 0; i < uPtCount - 1; i++) {
    vec2 a = uPts[i], b = uPts[i + 1];
    if (p.x >= a.x && p.x <= b.x) {
      float t = (p.x - a.x) / (b.x - a.x);
      top = mix(a.y, b.y, t * t * (3.0 - 2.0 * t));
    }
  }
  if (p.x > last.x) top = last.y;
  top += 0.005 * sin(p.x * 31.0 + uSeed) + wobble(p, 45.0, 0.008);
  float side = smoothstep(first.x - 0.015, first.x + 0.015, p.x) * (1.0 - smoothstep(last.x - 0.015, last.x + 0.015, p.x));
  vec3 c;
  if (uStyle > 0.5) {
    c = carpet(p, uBottom, uTop, top, uScale, uSpeckA, uSpeckB, uSpeck.y);
  } else {
    c = mix(uTop, uBottom, smoothstep(0.0, uFade, p.y - top));
    c *= 0.8 + 0.32 * fuzz(p) + 0.08 * vnoise(p * 90.0);
    c = mix(c, uTop * 1.18, (1.0 - smoothstep(0.0, 0.012, p.y - top)) * 0.5); // light catching the top edge
    if (uSpeck.w > 0.5) c = specks(p, c, uSpeck.x, uSpeck.y, uSpeckA, uSpeckB, uSpeck.z);
  }
  float a = clamp(0.5 - (top - p.y + (fuzz(p) - 0.5) * 3.0 * uPx) / (1.4 * uPx), 0.0, 1.0) * side;
  outColor = vec4(c * a, a);
}`;

  const FUZZ = `
uniform vec2 uCenter, uRadii;
uniform vec3 uColor;
void main() {
  vec2 p = scenePos();
  vec2 q = (p - uCenter) / uRadii;
  float d = (length(q) - 1.0) * min(uRadii.x, uRadii.y) + wobble(p, 120.0, 0.006);
  float z = sqrt(max(1.0 - dot(q, q), 0.05));
  vec3 c = lit(uColor * (0.75 + 0.4 * fuzz(p)), vec3(q * 0.8, z), 1.0);
  float a = clamp(0.5 - (d + (fuzz(p) - 0.5) * 4.0 * uPx) / (1.6 * uPx), 0.0, 1.0);
  outColor = vec4(c * a, a);
}`;

  // ---- sprites ----
  const SPRITE = `
uniform int uKind;          // 0 flower (petal list), 1 leaf
uniform vec2 uA, uB, uC;    // stem base, stem bend, flower center (leaf tip for leaves)
uniform float uSize;        // leaf width
uniform vec3 uCol1, uCol2, uCol3;
uniform int uPetalCount;
uniform vec4 uPetal[16];    // angle, length, width, fuzz
uniform vec3 uPetalPos[16]; // offset from center (x, y), tone
uniform float uSquash;      // >1 flattens the flower toward the viewer
uniform vec4 uCenter;       // radius, style (0 none, 1 felt disc, 2 orchid column, 3 dark eye), 0, 0

// A teardrop petal from c out along ang. k is the normalized distance (0 at the edge).
float petalShape(vec2 p, vec2 c, float ang, float len, float wid, out float k, out vec2 lp, out float w) {
  vec2 dir = vec2(cos(ang), sin(ang));
  vec2 q = p - c;
  lp = vec2(dot(q, dir), dot(q, vec2(-dir.y, dir.x)));
  float t = clamp(lp.x / len, 0.0, 1.0);
  w = wid * (0.3 + 0.7 * sin(t * PI * 0.92 + 0.12)) * (1.0 - 0.25 * smoothstep(0.7, 1.0, t));
  vec2 e = vec2((lp.x - len * 0.5) / (len * 0.5), lp.y / max(w, 1e-4));
  k = length(e) - 1.0;
  return k * min(len * 0.5, w);
}

void main() {
  vec2 p = scenePos();
  vec4 acc = vec4(0.0);
  float t;
  float dc = sdBezier(p, uA, uB, uC, t);
  vec2 q = bez(uA, uB, uC, t);

  if (uKind == 1) {
    // Leaf: a tapered blade along the curve, bright and a little see-through, like resin.
    float w = uSize * pow(sin(t * PI * 0.96 + 0.04), 0.7) * (1.0 - 0.3 * t);
    float d = dc - w + wobble(p, 90.0, 0.0012);
    vec2 tang = normalize(bez(uA, uB, uC, min(t + 0.02, 1.0)) - bez(uA, uB, uC, max(t - 0.02, 0.0)) + 1e-6);
    vec2 side = vec2(-tang.y, tang.x);
    float across = dot(p - q, side) / max(w, 1e-4);
    vec3 c = mix(uCol2, uCol1, smoothstep(0.1, 1.0, abs(across)));
    c = mix(c, uCol3, (1.0 - smoothstep(0.0, 0.12, abs(across))) * 0.6);
    c = lit(c, vec3(side * across * 0.6, 1.0), 1.0);
    c += vec3(0.25, 0.3, 0.2) * smoothstep(0.5, 0.8, -across) * smoothstep(0.2, 0.6, t) * 0.6;
    over(acc, c, fill(d) * 0.92);
    outColor = acc;
    return;
  }

  // Stem: a rounded green cylinder, thicker at the base.
  float r = mix(0.0048, 0.0028, t);
  vec2 off = p - q;
  float x = clamp(length(off) / r, 0.0, 1.0);
  vec3 sn = vec3(normalize(off + 1e-6) * x, sqrt(1.0 - x * x));
  over(acc, lit(mix(vec3(0.18, 0.40, 0.22), vec3(0.32, 0.60, 0.30), t), sn, 1.0), fill(dc - r + wobble(p, 80.0, 0.001)));

  vec2 c = uC;
  vec2 pf = c + (p - c) * vec2(1.0, uSquash);
  for (int i = 0; i < uPetalCount; i++) {
    vec4 pt = uPetal[i];
    vec3 pp = uPetalPos[i];
    float k, w;
    vec2 lp;
    float d = petalShape(pf, c + pp.xy, pt.x, pt.y, pt.z, k, lp, w) + wobble(p, 220.0, pt.y * 0.06);
    float a = fill(d);
    if (a <= 0.0) continue;
    float tt = clamp(lp.x / pt.y, 0.0, 1.0);
    float across = clamp(lp.y / max(w, 1e-4), -1.0, 1.0);
    vec3 col = mix(uCol1, uCol2, smoothstep(0.15, 1.0, tt)) * pp.z;
    col *= 0.82 + 0.3 * vnoise(vec2(tt * 5.0 + float(i) * 3.1, across * 7.0));   // veins and streaks
    col *= mix(1.0, 0.82 + 0.34 * fuzz(p), pt.w);                                 // felt or silk
    col = mix(col, uCol3, smoothstep(-0.22, 0.0, k) * 0.5);                       // pale, see-through rim
    vec2 dir = vec2(cos(pt.x), sin(pt.x));
    col = lit(col, vec3(vec2(-dir.y, dir.x) * across * 0.75 + dir * (tt - 0.4) * 0.5, 1.0), 1.0);
    over(acc, col, a);
  }

  if (uCenter.y > 0.5) {
    float rr = uCenter.x;
    float dd = length(pf - c) - rr + wobble(p, 300.0, rr * 0.15);
    vec3 n = vec3((pf - c) / rr * 0.7, 0.7);
    vec3 cc = uCenter.y < 1.5 ? uCol3 * (0.8 + 0.35 * fuzz(p))
            : uCenter.y < 2.5 ? mix(uCol3, uCol2, 0.35)
            : uCol1 * 0.4;
    over(acc, lit(cc, n, 1.0), fill(dd));
  }
  outColor = acc;
}`;

  // Petal lists per flower kind: [angle, length, width, fuzz], [x, y, tone] (in units of size).
  function petals(kind, S, tilt, seed) {
    const out = [];
    const jitter = (i) => (Math.sin(i * 12.9898 + seed * 78.233) * 43758.5453) % 1;
    const add = (ang, len, wid, fz, x = 0, y = 0, tone = 1) => out.push([ang + tilt, len * S, wid * S, fz, x * S, y * S, tone]);
    const up = -Math.PI / 2;
    if (kind === "daisy") {
      for (let i = 0; i < 11; i++) add((i / 11) * Math.PI * 2 + jitter(i) * 0.2, 1, 0.36, 0.9);
    } else if (kind === "tulip") {
      add(up, 1.45, 0.55, 0.3, 0, 0.25, 0.72);
      add(up - 0.32, 1.35, 0.5, 0.3, -0.08, 0.25, 1.0);
      add(up + 0.32, 1.35, 0.5, 0.3, 0.08, 0.25, 1.04);
    } else if (kind === "orchid") {
      add(up - 0.15, 0.95, 0.4, 0.15, 0, 0, 0.82);               // dorsal sepal
      add(Math.PI / 2 - 0.45, 1.3, 0.36, 0.15, 0, 0, 0.88);      // lower sepals, drooping
      add(Math.PI / 2 + 0.75, 0.95, 0.32, 0.15, 0, 0, 0.82);
      add(up - 1.05, 1.35, 0.56, 0.15, 0, 0, 1.0);               // the two big petals in a V
      add(up + 0.8, 1.3, 0.54, 0.15, 0, 0, 1.05);
      add(Math.PI / 2 + 0.1, 0.55, 0.3, 0.1, 0, 0.08, 0.55);     // dark lip
    } else if (kind === "bloom") {
      for (let i = 0; i < 8; i++) add((i / 8) * Math.PI * 2 + jitter(i) * 0.3, 1, 0.62, 0.25, 0, 0, 0.88);
      for (let i = 0; i < 5; i++) add((i / 5) * Math.PI * 2 + 0.6, 0.6, 0.5, 0.25, 0, 0, 1.0);
    }
    return out;
  }
  const FLOWER = {
    daisy: { squash: 1.15, center: [0.34, 1] },
    tulip: { squash: 1.0, center: [0, 0] },
    orchid: { squash: 1.0, center: [0.11, 2] },
    bloom: { squash: 1.35, center: [0.14, 3] },
  };

  function setLobes(gl, u, el) {
    const flat = new Float32Array(24);
    el.lobes.forEach((l, i) => flat.set(l, i * 3));
    gl.uniform3fv(u.uLobes, flat);
    gl.uniform1i(u.uLobeCount, el.lobes.length);
    gl.uniform1f(u.uMerge, el.merge ?? 0.03);
  }
  function setSpeck(gl, u, s) {
    if (s) {
      gl.uniform4f(u.uSpeck, s.scale, s.density, s.size ?? 0.3, 1);
      gl.uniform3f(u.uSpeckA, ...rgb(s.colors[0]));
      gl.uniform3f(u.uSpeckB, ...rgb(s.colors[1]));
    } else {
      gl.uniform4f(u.uSpeck, 1, 0, 0, 0);
    }
  }
  const lobeBox = (el, m) => {
    const xs = el.lobes.flatMap((l) => [l[0] - l[2], l[0] + l[2]]);
    const ys = el.lobes.flatMap((l) => [l[1] - l[2], l[1] + l[2]]);
    return [Math.min(...xs) - m, Math.min(...ys) - m, Math.max(...xs) + m, Math.max(...ys) + m];
  };

  LB.ELEMENTS = {
    canopy: {
      glsl: CANOPY,
      bbox: (el) => lobeBox(el, 0.05),
      set(gl, u, el) {
        setLobes(gl, u, el);
        const [shadow, mid, light, tip, tip2] = el.colors;
        gl.uniform3f(u.uShadow, ...rgb(shadow));
        gl.uniform3f(u.uMid, ...rgb(mid));
        gl.uniform3f(u.uLight, ...rgb(light));
        gl.uniform3f(u.uTip, ...rgb(tip));
        gl.uniform3f(u.uTip2, ...rgb(tip2 || tip));
        gl.uniform2f(u.uTipBand, ...(el.tipBand || [0, 0]));
        gl.uniform1f(u.uScale, el.scale);
        setSpeck(gl, u, el.specks);
      },
    },
    florets: {
      glsl: FLORETS,
      bbox: (el) => lobeBox(el, 0.035),
      set(gl, u, el) {
        setLobes(gl, u, { merge: 0.015, ...el });
        gl.uniform3f(u.uC1, ...rgb(el.colors[0]));
        gl.uniform3f(u.uC2, ...rgb(el.colors[1]));
        gl.uniform3f(u.uGap, ...rgb(el.colors[2]));
        gl.uniform1f(u.uScale, el.scale);
      },
    },
    trunk: {
      glsl: TRUNK,
      bbox: (el) => [el.x - el.width - el.flare - Math.abs(el.bend) - 0.02, el.top - 0.01, el.x + el.width + el.flare + Math.abs(el.bend) + 0.02, el.bottom + 0.01],
      set(gl, u, el) {
        gl.uniform4f(u.uTrunk, el.x, el.bend, el.width, el.flare);
        gl.uniform2f(u.uSpan, el.top, el.bottom);
        gl.uniform3f(u.uColor, ...rgb(el.color));
      },
    },
    branch: {
      glsl: BRANCH,
      bbox: (el) => [Math.min(el.a[0], el.b[0]) - el.r - 0.01, Math.min(el.a[1], el.b[1]) - el.r - 0.01, Math.max(el.a[0], el.b[0]) + el.r + 0.01, Math.max(el.a[1], el.b[1]) + el.r + 0.01],
      set(gl, u, el) {
        gl.uniform2f(u.uA, ...el.a);
        gl.uniform2f(u.uB, ...el.b);
        gl.uniform1f(u.uR, el.r);
        gl.uniform3f(u.uColor, ...rgb(el.color));
      },
    },
    turf: {
      glsl: TURF,
      bbox: (el) => [el.points[0][0] - 0.02, Math.min(...el.points.map((p) => p[1])) - 0.02, el.points[el.points.length - 1][0] + 0.02, 2],
      set(gl, u, el) {
        const flat = new Float32Array(16);
        el.points.forEach((pt, i) => flat.set(pt, i * 2));
        gl.uniform2fv(u.uPts, flat);
        gl.uniform1i(u.uPtCount, el.points.length);
        gl.uniform3f(u.uTop, ...rgb(el.colors[0]));
        gl.uniform3f(u.uBottom, ...rgb(el.colors[1]));
        gl.uniform1f(u.uFade, el.fade ?? 0.08);
        gl.uniform1f(u.uStyle, el.style === "carpet" ? 1 : 0);
        gl.uniform1f(u.uScale, el.scale ?? 30);
        setSpeck(gl, u, el.specks);
      },
    },
    fuzz: {
      glsl: FUZZ,
      bbox: (el) => [el.center[0] - el.radii[0] - 0.01, el.center[1] - el.radii[1] - 0.01, el.center[0] + el.radii[0] + 0.01, el.center[1] + el.radii[1] + 0.01],
      set(gl, u, el) {
        gl.uniform2f(u.uCenter, ...el.center);
        gl.uniform2f(u.uRadii, ...el.radii);
        gl.uniform3f(u.uColor, ...rgb(el.color));
      },
    },
  };

  LB.SPRITE = {
    glsl: SPRITE,
    bbox(L) {
      const pts = [L.a, L.b, L.c];
      const reach = L.flower ? L.size * 1.75 : L.size * 1.3;
      const m = 0.012;
      const xs = pts.map((p) => p[0]), ys = pts.map((p) => p[1]);
      return [Math.min(...xs) - reach - m, Math.min(...ys) - reach - m, Math.max(...xs) + reach + m, Math.max(...ys) + reach + m];
    },
    set(gl, u, L) {
      gl.uniform2f(u.uA, ...L.a);
      gl.uniform2f(u.uB, ...L.b);
      gl.uniform2f(u.uC, ...L.c);
      gl.uniform3f(u.uCol1, ...rgb(L.colors[0]));
      gl.uniform3f(u.uCol2, ...rgb(L.colors[1]));
      gl.uniform3f(u.uCol3, ...rgb(L.colors[2]));
      if (!L.flower) {
        gl.uniform1i(u.uKind, 1);
        gl.uniform1f(u.uSize, L.size);
        gl.uniform1i(u.uPetalCount, 0);
        return;
      }
      gl.uniform1i(u.uKind, 0);
      const list = petals(L.flower, L.size, L.tilt || 0, L.index || 0);
      const a = new Float32Array(64), b = new Float32Array(48);
      list.forEach((pt, i) => { a.set(pt.slice(0, 4), i * 4); b.set(pt.slice(4, 7), i * 3); });
      gl.uniform4fv(u.uPetal, a);
      gl.uniform3fv(u.uPetalPos, b);
      gl.uniform1i(u.uPetalCount, list.length);
      const f = FLOWER[L.flower];
      gl.uniform1f(u.uSquash, f.squash);
      gl.uniform4f(u.uCenter, f.center[0] * L.size, f.center[1], 0, 0);
    },
  };
})();

</script>
<script data-src="js/shapes.js">
/*
  Elements for pieces people make themselves, in the editor or by hand in a
  scene file:

    shape   a cut-out: rectangle, ellipse, polygon or star, or a blob of
            round lobes. Filled with a material (paper, felt, clay,
            foliage, a two-color gradient, or a photo the user imported),
            with a rough cut edge, a fiber fuzz, a "puff" that shades it
            like a stuffed or sculpted piece, beads, and a soft shadow cast
            down and to the right, away from the scene's top-left light.
    image   an imported picture (a photographed cut-out, a drawing), with
            an optional color tint.

  Two more outlines come from the editor's customizer: "path", a cut-out
  through up to 32 points (optionally smoothed), and "mask", a cut-out
  taken from a picture: a photographed paper shape, say. The renderer turns
  the picture into a distance field once (renderer.js, buildMask), so a
  mask gets the same rough edge, puff and shadow as any other shape.

  "Boil photos": an image or mask can list boilImages, two or three photos
  of the same object nudged slightly. In a layer with a pose cycle they
  swap pose by pose, which is real boil, from real material.

  Both are drawn in their own coordinates, centered on (0, 0), and placed
  by the item transform (see js/items.js), so moving, scaling or rotating
  one never changes its shader inputs.
*/
(function () {
  const LB = (window.LB = window.LB || {});
  const rgb = (h) => LB.gl.rgb(h);

  const SHAPE = `
uniform int uShape;       // 0 rectangle, 1 ellipse, 2 polygon or star, 3 blob, 4 custom outline (points), 5 cut-out from a picture
uniform vec2 uHalf;       // half width, half height
uniform vec2 uMid;        // center of the outline box (blobs and custom outlines needn't be centered on 0, 0)
uniform sampler2D uMask;  // a picture's distance field, for cut-outs
uniform float uMaskPx;    // scene units per distance-field pixel
uniform vec4 uForm;       // corner roundness 0..1, sides, star depth 0..1, 0
uniform int uMat;         // 0 paper, 1 felt, 2 clay, 3 foliage, 4 gradient, 5 photo, 6 water, 7 sand, 8 stripes, 9 cardboard
uniform vec3 uCol1, uCol2;
uniform float uGrain;     // pattern size multiplier
uniform vec4 uLook;       // edge roughness (scene units), puff 0..1, shadow 0..1, fuzz 0..1
uniform float uPuffW;     // how far in from the edge the puff rounds over
uniform vec2 uShadowOff;  // shadow offset in the shape's own coordinates
uniform vec4 uSpeck;      // scale, density, size, on
uniform vec3 uSpeckA, uSpeckB;
uniform sampler2D uImage;
uniform vec4 uPhoto;      // tile width, tile height, tint amount, 0
uniform vec3 uLobes[8];
uniform int uLobeCount;
uniform float uMerge;
uniform vec2 uPts[32];    // custom outline, in the shape's own coordinates
uniform int uPtCount;
uniform vec4 uStripe;     // mode (0 bands across, 1 fan from a point), stripe width or count, fan center x, y

// Signed distance to a closed outline through uPts (negative inside).
float sdPath(vec2 p) {
  float d = dot(p - uPts[0], p - uPts[0]);
  float s = 1.0;
  int j = uPtCount - 1;
  for (int i = 0; i < uPtCount; i++) {
    vec2 e = uPts[j] - uPts[i], w = p - uPts[i];
    vec2 b = w - e * clamp(dot(w, e) / max(dot(e, e), 1e-9), 0.0, 1.0);
    d = min(d, dot(b, b));
    bool c1 = p.y >= uPts[i].y, c2 = p.y < uPts[j].y, c3 = e.x * w.y > e.y * w.x;
    if ((c1 && c2 && c3) || (!c1 && !c2 && !c3)) s = -s;
    j = i;
  }
  return s * sqrt(d);
}

float sdShape(vec2 p) {
  if (uShape == 0) {
    float r = uForm.x * min(uHalf.x, uHalf.y);
    vec2 q = abs(p) - uHalf + r;
    return length(max(q, 0.0)) + min(max(q.x, q.y), 0.0) - r;
  }
  if (uShape == 1) {
    vec2 r = max(uHalf, vec2(1e-4));
    float k0 = length(p / r), k1 = length(p / (r * r));
    return k0 * (k0 - 1.0) / max(k1, 1e-6);
  }
  if (uShape == 2) {
    // A regular polygon in unit space, squashed to the box. Star depth pulls the edge midpoints in.
    vec2 u = p / max(uHalf, vec2(1e-4));
    float an = PI / max(uForm.y, 3.0);
    float a = atan(u.x, -u.y);
    float bn = mod(a + an, 2.0 * an) - an;
    vec2 q = length(u) * vec2(cos(bn), abs(sin(bn)));
    vec2 A = vec2(1.0, 0.0), B = cos(an) * (1.0 - uForm.z * 0.75) * vec2(cos(an), sin(an));
    vec2 e = B - A, w = q - A;
    vec2 h = w - e * clamp(dot(w, e) / dot(e, e), 0.0, 1.0);
    float side = sign(e.x * w.y - e.y * w.x);
    return -side * length(h) * min(uHalf.x, uHalf.y);
  }
  if (uShape == 4) return sdPath(p) - uForm.x;
  if (uShape == 5) {
    // Distance field texels hold 128 + 4 x the distance in texels, so +-32 texels around the edge.
    vec2 uv = p / (2.0 * uHalf) + 0.5;
    float m = (texture(uMask, clamp(uv, 0.0, 1.0)).r * 255.0 - 128.0) / 4.0 * uMaskPx;
    vec2 q = abs(p) - uHalf;
    return max(m, length(max(q, 0.0)) + min(max(q.x, q.y), 0.0));
  }
  float d = 1e9;
  for (int i = 0; i < uLobeCount; i++) d = smin(d, length(p - uLobes[i].xy) - uLobes[i].z, uMerge);
  return d;
}

void main() {
  vec2 p = scenePos();
  float d = 1e9, ds = 1e9;
  int passes = uLook.z > 0.0 ? 2 : 1;
  for (int i = 0; i < passes; i++) {
    vec2 q = i == 0 ? p : p - uShadowOff;
    float v = sdShape(q) + wobble(q, 18.0, uLook.x);
    if (i == 0) d = v; else ds = v;
  }

  vec2 pp = p * uGrain + uSeed * 1.7;
  float tY = smoothstep(uMid.y - uHalf.y, uMid.y + uHalf.y, p.y);

  // Shared noise, each computed exactly once. The Windows shader compiler inlines every call site,
  // so one call per noise (with a scale picked by material) keeps this shader quick to compile.
  float pap = paper(p);
  float fz = fuzz(p);
  float br = brush(pp, uMat == 4 ? 6.0 : uMat == 6 ? 9.0 : uMat == 8 ? 25.0 : 30.0);
  float m1 = fbm3(pp * (uMat == 1 ? 24.0 : uMat == 2 ? 20.0 : uMat == 6 ? 3.0 : uMat == 7 ? 8.0 : 14.0));
  // Clay's dents are lit from their slope, taken from the screen-space change in m1.
  vec2 mSlope = vec2(dFdx(m1), dFdy(m1)) / max(20.0 * uGrain * uPx, 1e-6) * 0.39;
  vec2 nq = uMat == 6 ? vec2(pp.x * 7.0 + m1 * 2.0, pp.y * mix(170.0, 55.0, tY)) : uMat == 7 ? p / uPx * 0.8 : pp * (uMat == 2 ? 140.0 : 90.0);
  float n1 = vnoise(nq);

  float th = 0.5;
  vec3 c;
  if (uMat == 0) {
    c = uCol1 * (0.9 + 0.16 * pap) * (0.95 + 0.08 * br);
  } else if (uMat == 1) {
    c = uCol1 * (0.78 + 0.38 * fz) * (0.9 + 0.18 * m1);
  } else if (uMat == 2) {
    // Thumb-pressed clay: soft dents lit from the key light, and a slight mottle in the paint.
    vec3 cn = normalize(vec3(mSlope, 1.0));
    c = lit(uCol1 * (0.94 + 0.1 * m1), cn, 1.0) / lit(vec3(1.0), vec3(0.0, 0.0, 1.0), 1.0);
    c *= 0.98 + 0.04 * n1;
  } else if (uMat == 3) {
    c = foliage(p, uCol1 * 0.35, uCol1, min(uCol1 * 1.35 + 0.04, vec3(1.0)), uCol2, 90.0 * uGrain, th);
    d -= (th - 0.45) * 0.8 / (90.0 * uGrain);
  } else if (uMat == 4) {
    c = mix(uCol1, uCol2, tY) * (0.95 + 0.08 * pap) * (0.97 + 0.05 * br);
  } else if (uMat == 5) {
    vec3 ph = texture(uImage, p / uPhoto.xy + 0.5).rgb;
    float lum = dot(ph, vec3(0.299, 0.587, 0.114));
    c = mix(ph, clamp(uCol1 * lum * 2.0, 0.0, 1.0), uPhoto.z);
  } else if (uMat == 6) {
    // Painted water: far color to near color, with ripple strokes that crowd together toward the top (the distance).
    c = mix(uCol1, uCol2, tY);
    c = mix(c, min(c * 1.25 + 0.1, vec3(1.0)), smoothstep(0.62, 0.92, n1) * 0.7);
    c *= 0.9 + 0.1 * smoothstep(0.15, 0.45, n1);
    c *= 0.95 + 0.08 * br;
  } else if (uMat == 7) {
    // Sand: dry color to wet color down the piece, grains about a pixel each, soft ripples, a few darker grains.
    c = mix(uCol1, uCol2, tY);
    c *= 0.9 + 0.17 * (0.6 * n1 + 0.4 * pap);
    c *= 0.96 + 0.06 * sin(pp.y * 160.0 + m1 * 6.0);
    c *= 0.94 + 0.1 * m1;
    c = mix(c, c * 0.62, step(0.985, hash12(floor(p / uPx * 0.56))));
  } else if (uMat == 8) {
    // Stripes, painted by hand: bands across the piece, or a fan from a point (beach umbrellas).
    float u = uStripe.x < 0.5 ? p.y / max(uStripe.y, 1e-4) : atan(p.x - uStripe.z, p.y - uStripe.w) / (2.0 * PI) * uStripe.y;
    u += (m1 - 0.5) * 0.12;
    float band = smoothstep(0.47, 0.53, abs(fract(u) - 0.5) * 2.0);
    c = mix(uCol1, uCol2, band) * (0.92 + 0.12 * pap) * (0.96 + 0.06 * br);
  } else {
    // Cardboard: kraft fibers, faint corrugation showing through, a few darker flecks.
    c = uCol1 * (0.86 + 0.16 * fz) * (0.95 + 0.08 * m1);
    c *= 0.97 + 0.04 * sin(pp.x * 420.0);
    c = mix(c, uCol2, smoothstep(0.86, 0.95, n1) * 0.5);
  }
  if (uSpeck.w > 0.5) c = specks(p, c, uSpeck.x, uSpeck.y, uSpeckA, uSpeckB, uSpeck.z);

  // Puff: shade the piece as if its edges round over, lit by the scene's key light.
  // Screen-space derivatives give the outward direction of the edge in scene space, rotation included.
  vec2 g = vec2(dFdx(d), dFdy(d));
  float gLen = length(g);
  g = gLen > 0.0 ? g / gLen : vec2(0.0);
  float h = clamp(-d / uPuffW, 0.0, 1.0);
  vec3 n = vec3(g * uLook.y * pow(1.0 - h, 1.5) * 2.2, 1.0);
  c *= lit(vec3(1.0), n, 1.0) / lit(vec3(1.0), vec3(0.0, 0.0, 1.0), 1.0) * mix(1.0, 0.82 + 0.18 * h, uLook.y);

  float a = clamp(0.5 - (d + (fz - 0.5) * uLook.w * 5.0 * uPx) / (1.4 * uPx), 0.0, 1.0);
  float blur = 0.004 + 0.012 * uLook.z;
  float sa = uLook.z > 0.0 ? smoothstep(blur, -blur, ds) * 0.5 * min(uLook.z * 1.5, 1.0) : 0.0;
  vec4 acc = vec4(0.0);
  over(acc, vec3(0.07, 0.04, 0.1), sa);
  over(acc, c, a);
  outColor = acc;
}`;

  const IMAGE = `
uniform sampler2D uImage;
uniform vec2 uHalf;
uniform vec4 uTint;   // color, amount
void main() {
  vec2 uv = scenePos() / (2.0 * uHalf) + 0.5;
  if (uv.x < 0.0 || uv.y < 0.0 || uv.x > 1.0 || uv.y > 1.0) { outColor = vec4(0.0); return; }
  vec4 c = texture(uImage, uv);
  float lum = dot(c.rgb, vec3(0.299, 0.587, 0.114));
  c.rgb = mix(c.rgb, clamp(uTint.rgb * lum * 2.0, 0.0, 1.0), uTint.a);
  outColor = vec4(c.rgb * c.a, c.a);
}`;

  const SHAPES = ["rect", "ellipse", "polygon", "blob", "path", "mask"];
  const MATERIALS = ["paper", "felt", "clay", "foliage", "gradient", "photo", "water", "sand", "stripes", "cardboard"];

  const half = (el) => [Math.max(el.w || 0.2, 0.002) / 2, Math.max(el.h || 0.2, 0.002) / 2];
  function lobeBounds(el) {
    const ls = el.lobes && el.lobes.length ? el.lobes : [[0, 0, 0.1]];
    return [
      Math.min(...ls.map((l) => l[0] - l[2])), Math.min(...ls.map((l) => l[1] - l[2])),
      Math.max(...ls.map((l) => l[0] + l[2])), Math.max(...ls.map((l) => l[1] + l[2])),
    ];
  }
  // The points the shader draws: the control points, or with "smooth", a curve cut from them
  // (Chaikin corner cutting, as many passes as fit in 32 points).
  const DEFAULT_PTS = [[-0.1, -0.1], [0.1, -0.1], [0, 0.1]];
  function pathPoints(el) {
    let ps = el.points && el.points.length >= 3 ? el.points.slice(0, 32) : DEFAULT_PTS;
    if (el.smooth) {
      while (ps.length * 2 <= 32) {
        const out = [];
        for (let i = 0; i < ps.length; i++) {
          const a = ps[i], b = ps[(i + 1) % ps.length];
          out.push([a[0] * 0.75 + b[0] * 0.25, a[1] * 0.75 + b[1] * 0.25], [a[0] * 0.25 + b[0] * 0.75, a[1] * 0.25 + b[1] * 0.75]);
        }
        ps = out;
      }
    }
    return ps;
  }
  function pathBounds(el) {
    const ps = pathPoints(el);
    const r = el.round || 0;
    return [Math.min(...ps.map((p) => p[0])) - r, Math.min(...ps.map((p) => p[1])) - r, Math.max(...ps.map((p) => p[0])) + r, Math.max(...ps.map((p) => p[1])) + r];
  }
  // The shape's outline box, before roughness, fuzz and shadow.
  function outline(el) {
    if (el.shape === "blob") return lobeBounds(el);
    if (el.shape === "path") return pathBounds(el);
    const [hx, hy] = half(el);
    return [-hx, -hy, hx, hy];
  }
  // Rough edges are capped for small pieces, so a tiny shape keeps its outline.
  const roughAmp = (el) => {
    const b = outline(el);
    return (el.rough ?? 0.4) * Math.min(0.012, 0.12 * Math.min(b[2] - b[0], b[3] - b[1]) / 2);
  };
  const SHADOW_OFF = [0.012, 0.018]; // at shadow 1, in scene units: down and right, away from the key light

  // Every picture a shape may sample: its own, and its boil photos.
  const pictures = (el) => (el.image ? [el.image, ...(el.boilImages || [])] : []);
  const maskKey = (el, image = el.image) => `${image}|${(el.mask && el.mask.from) || "alpha"}|${(el.mask && el.mask.threshold) ?? 0.5}`;

  LB.ELEMENTS.shape = {
    glsl: SHAPE,
    images: (el) => (el.material === "photo" || el.shape === "mask" ? pictures(el) : []),
    masks: (el) => (el.shape === "mask" ? pictures(el).map((im) => ({ key: maskKey(el, im), image: im, from: (el.mask && el.mask.from) || "alpha", threshold: (el.mask && el.mask.threshold) ?? 0.5 })) : []),
    maskKey,
    pathPoints,
    outline,
    bbox(el) {
      const b = outline(el);
      const s = el.shadow || 0;
      const m = roughAmp(el) + 0.01 + (el.material === "foliage" ? 0.02 : 0);
      return [b[0] - m, b[1] - m, b[2] + m + (SHADOW_OFF[0] + 0.02) * s, b[3] + m + (SHADOW_OFF[1] + 0.02) * s];
    },
    set(gl, u, el, xf) {
      const b = outline(el);
      const hx = (b[2] - b[0]) / 2, hy = (b[3] - b[1]) / 2;
      gl.uniform1i(u.uShape, Math.max(0, SHAPES.indexOf(el.shape)));
      const boxed = el.shape === "blob" || el.shape === "path";
      gl.uniform2f(u.uHalf, ...(boxed ? [hx, hy] : half(el)));
      gl.uniform2f(u.uMid, ...(boxed ? [(b[0] + b[2]) / 2, (b[1] + b[3]) / 2] : [0, 0]));
      const mask = el.shape === "mask" && LB.maskInfo ? LB.maskInfo(maskKey(el)) : null;
      gl.uniform1f(u.uMaskPx, mask ? (el.w || 0.2) / mask.w : 0.001);
      gl.uniform4f(u.uForm, el.shape === "path" ? el.round || 0 : el.corner ?? 0.15, el.sides ?? 5, el.shape === "polygon" ? el.star ?? 0 : 0, 0);
      if (el.shape === "path") {
        const pts = pathPoints(el);
        const flatP = new Float32Array(64);
        // Outline points are relative to the shape's center, so the box center has to be (0, 0) for them too.
        pts.forEach((pt, i) => flatP.set(pt, i * 2));
        gl.uniform2fv(u.uPts, flatP);
        gl.uniform1i(u.uPtCount, pts.length);
      } else gl.uniform1i(u.uPtCount, 0);
      const st = el.stripes || {};
      gl.uniform4f(u.uStripe, st.fan ? 1 : 0, st.fan ? st.count ?? 12 : st.width ?? 0.03, ...(st.center || [0, b[1]]));
      gl.uniform1i(u.uMat, Math.max(0, MATERIALS.indexOf(el.material)));
      const [c1, c2] = el.colors || ["#8A6FB8", "#E9C6E2"];
      gl.uniform3f(u.uCol1, ...rgb(c1));
      gl.uniform3f(u.uCol2, ...rgb(c2 || c1));
      gl.uniform1f(u.uGrain, el.grain ?? 1);
      const s = el.shadow || 0;
      gl.uniform4f(u.uLook, roughAmp(el), el.puff ?? 0.3, s, el.fuzz ?? 0.3);
      gl.uniform1f(u.uPuffW, Math.max(0.004, Math.min(hx, hy) * 0.6));
      // The shadow falls the same way in the scene whatever the shape's rotation, so undo the rotation here.
      const r = (xf && xf.r) || 0, k = (xf && xf.s) || 1;
      const ox = SHADOW_OFF[0] * s, oy = SHADOW_OFF[1] * s;
      gl.uniform2f(u.uShadowOff, (Math.cos(r) * ox + Math.sin(r) * oy) / k, (-Math.sin(r) * ox + Math.cos(r) * oy) / k);
      const sp = el.specks;
      if (sp && sp.on !== false) {
        gl.uniform4f(u.uSpeck, sp.scale ?? 150, sp.density ?? 0.2, sp.size ?? 0.3, 1);
        gl.uniform3f(u.uSpeckA, ...rgb(sp.colors[0]));
        gl.uniform3f(u.uSpeckB, ...rgb(sp.colors[1] || sp.colors[0]));
      } else gl.uniform4f(u.uSpeck, 1, 0, 0, 0);
      const tile = el.tile || 0.4;
      const img = el.material === "photo" && LB.imageInfo ? LB.imageInfo(el.image) : null;
      const aspect = img ? img.h / img.w : 1;
      // A cut-out filled with its own picture shows that picture once, edge to edge, not tiled.
      if (el.shape === "mask" && el.material === "photo") gl.uniform4f(u.uPhoto, ...half(el).map((v) => v * 2), el.tint ?? 0, 0);
      else gl.uniform4f(u.uPhoto, tile, tile * aspect, el.tint ?? 0, 0);
      const flat = new Float32Array(24);
      (el.lobes || []).slice(0, 8).forEach((l, i) => flat.set(l, i * 3));
      gl.uniform3fv(u.uLobes, flat);
      gl.uniform1i(u.uLobeCount, Math.min(8, (el.lobes || []).length));
      gl.uniform1f(u.uMerge, el.merge ?? 0.03);
    },
  };

  LB.ELEMENTS.image = {
    glsl: IMAGE,
    images: pictures,
    bbox(el) {
      const [hx, hy] = half(el);
      return [-hx, -hy, hx, hy];
    },
    set(gl, u, el) {
      gl.uniform2f(u.uHalf, ...half(el));
      gl.uniform4f(u.uTint, ...rgb(el.tintColor || "#FFFFFF"), el.tint ?? 0);
    },
  };

  LB.SHAPE_KINDS = SHAPES;
  LB.SHAPE_MATERIALS = MATERIALS;
})();

</script>
<script data-src="js/clay.js">
/*
  3D clay pieces: a sculpt made of up to 16 rounded parts that blend into
  each other like pressed clay, raymarched once per pose when the layer
  bakes. Then it's a flat texture like everything else, so a 3D piece costs
  the same to show as a paper one.

    parts     { kind: "sphere", at: [x, y, z], r }
              { kind: "capsule", at, to, r, r2 }        a tapered tube from at to to
              { kind: "box", at, size: [hx, hy, hz], r } a rounded box
              { kind: "ellipsoid", at, size: [rx, ry, rz] }
              each with a color, and carve: true to cut it away instead
    blend     how softly parts merge, in scene units (0 is a hard join)
    yaw       turn around the vertical axis (radians); a turntable steps this
    pitch     tilt toward or away from the viewer
    squash    squash and stretch: under 1 squashes, over 1 stretches (volume kept)
    material  "clay" (thumb dents), "felt" (fibers, fuzzy edge) or "plastic" (a highlight)

  Units are scene units. x runs right, y down (as in the scene), z toward
  the viewer. The camera looks straight down -z, so a piece is drawn the
  way a stop-motion camera sees a model on the set. The light is the
  scene's key from the top left plus the cool fill, with a soft shadow from
  the key and a little ambient occlusion, and the piece casts a shadow onto
  whatever is behind it, like the flat shapes do.

  Poses can add yaw and pitch and multiply squash, as well as move, turn
  and scale (js/items.js).

  Compile cost: the Windows shader compiler inlines every call site, so the
  whole raymarch (the march, the normal, the key-light shadow, the ambient
  occlusion and the cast shadow) is one loop with one call to map().
*/
(function () {
  const LB = (window.LB = window.LB || {});
  const rgb = (h) => LB.gl.rgb(h);
  const MAX = 16;
  const KINDS = ["sphere", "capsule", "box", "ellipsoid"];
  const MATS = ["clay", "felt", "plastic"];

  const CLAY = `
uniform int uCount;
uniform vec4 uPart[16];        // kind, carve (0 or 1), radius, end radius (capsules)
uniform vec3 uPA[16];          // center, or a capsule's start
uniform vec3 uPB[16];          // a capsule's end, or a box's or ellipsoid's half size
uniform vec3 uPCol[16];
uniform float uBlend;
uniform vec3 uTurn;            // yaw, pitch, squash
uniform float uBound;          // bounding radius in scene units: rays start and stop there
uniform int uMat3;             // 0 clay, 1 felt, 2 plastic
uniform float uDent, uFuzz3, uShadowAmt;
uniform vec2 uShadowOff;
uniform int uSteps;

float part(int i, vec3 q) {
  vec4 P = uPart[i];
  vec3 a = uPA[i], b = uPB[i];
  if (P.x < 0.5) return length(q - a) - P.z;
  if (P.x < 1.5) {
    vec3 pa = q - a, ba = b - a;
    float h = clamp(dot(pa, ba) / max(dot(ba, ba), 1e-9), 0.0, 1.0);
    return length(pa - ba * h) - mix(P.z, P.w, h);
  }
  if (P.x < 2.5) {
    vec3 d = abs(q - a) - b + P.z;
    return length(max(d, 0.0)) + min(max(d.x, max(d.y, d.z)), 0.0) - P.z;
  }
  vec3 r = max(b, vec3(1e-4));
  float k0 = length((q - a) / r), k1 = length((q - a) / (r * r));
  return k0 * (k0 - 1.0) / max(k1, 1e-6);
}

// The whole sculpt at q (its own coordinates), and the blended color there.
float map(vec3 q, out vec3 col) {
  float d = 1e9;
  col = uPCol[0];
  float k = max(uBlend, 1e-4);
  for (int i = 0; i < uCount; i++) {
    float di = part(i, q);
    if (uPart[i].y > 0.5) {
      float h = clamp(0.5 - 0.5 * (d + di) / k, 0.0, 1.0);
      d = mix(d, -di, h) + k * h * (1.0 - h);
    } else {
      float h = clamp(0.5 + 0.5 * (di - d) / k, 0.0, 1.0);
      d = mix(di, d, h) - k * h * (1.0 - h);
      col = mix(uPCol[i], col, h);
    }
  }
  // Thumb-pressed dents in clay; felt and plastic stay smooth (felt gets its fibers in the color).
  if (uMat3 == 0) d += (vnoise(q.xy * 90.0 + q.z * 47.0 + uSeed) - 0.5) * uDent;
  return d;
}

mat3 turnMatrix(float yaw, float pitch) {
  float cy = cos(yaw), sy = sin(yaw), cp = cos(pitch), sp = sin(pitch);
  mat3 ry = mat3(cy, 0.0, -sy, 0.0, 1.0, 0.0, sy, 0.0, cy);
  mat3 rx = mat3(1.0, 0.0, 0.0, 0.0, cp, sp, 0.0, -sp, cp);
  return ry * rx;
}

void main() {
  vec2 p = scenePos();
  // World = S R q, so q = R^T S^-1 world. Squash keeps volume: y by s, x and z by 1/sqrt(s).
  float sq = max(uTurn.z, 0.2);
  vec3 sInv = vec3(sqrt(sq), 1.0 / sq, sqrt(sq));
  float lip = min(1.0 / sqrt(sq), sq);   // distances shrink by at most this under the squash
  mat3 Rt = transpose(turnMatrix(uTurn.x, uTurn.y));
  vec3 L = normalize(KEY_DIR);

  vec3 ro = vec3(p, uBound), ro2 = vec3(p - uShadowOff, uBound);
  float t = 0.0, ts = 0.0, minD = 1e9, minS = 1e9, st = 0.004, sh = 1.0, ao = 1.0;
  int mode = 0, sub = 0;
  bool hit = false;
  vec3 hitW = vec3(0.0), nAcc = vec3(0.0), nW = vec3(0.0, 0.0, 1.0), colHit = vec3(0.0), colNear = uPCol[0];
  float eps = max(uPx * 0.5, 0.0004);

  for (int it = 0; it < uSteps; it++) {
    vec3 pw, e = vec3(0.0);
    if (mode == 0) pw = ro - vec3(0.0, 0.0, t);
    else if (mode == 1) {
      e = sub == 0 ? vec3(1.0, -1.0, -1.0) : sub == 1 ? vec3(-1.0, -1.0, 1.0) : sub == 2 ? vec3(-1.0, 1.0, -1.0) : vec3(1.0, 1.0, 1.0);
      pw = hitW + e * 0.0012;
    }
    else if (mode == 2) pw = hitW + nW * 0.003 + L * st;
    else if (mode == 3) pw = hitW + nW * (0.005 + 0.012 * float(sub));
    else if (mode == 4) pw = ro2 - vec3(0.0, 0.0, ts);
    else break;

    vec3 c;
    float d = map(Rt * (sInv * pw), c) * lip;

    if (mode == 0) {
      if (d < minD) { minD = d; colNear = c; }
      if (d < eps * 0.5) { hit = true; hitW = pw; colHit = c; mode = 1; sub = 0; }
      else { t += max(d * 0.9, eps * 0.5); if (t > 2.0 * uBound) mode = uShadowAmt > 0.0 ? 4 : 5; }
    } else if (mode == 1) {
      nAcc += e * d;
      sub++;
      if (sub == 4) { nW = normalize(nAcc); mode = 2; }
    } else if (mode == 2) {
      // Soft shadow from the key light: how close the ray toward the light passes to the sculpt.
      sh = min(sh, 10.0 * d / st);
      st += clamp(d, 0.002, 0.03);
      if (sh < 0.02 || st > 2.0 * uBound) { mode = 3; sub = 0; }
    } else if (mode == 3) {
      float hh = 0.005 + 0.012 * float(sub);
      ao -= max(hh - d, 0.0) * (sub == 0 ? 18.0 : 9.0);
      sub++;
      if (sub == 3) mode = uShadowAmt > 0.0 ? 4 : 5;
    } else {
      // The shadow the piece throws onto whatever is behind it, down and away from the light.
      minS = min(minS, d);
      if (d < eps || ts > 2.0 * uBound) mode = 5;
      else ts += max(d * 0.9, eps);
    }
  }

  vec4 acc = vec4(0.0);
  float blur = 0.004 + 0.012 * uShadowAmt;
  float sa = uShadowAmt > 0.0 ? smoothstep(blur, -blur, minS) * 0.5 * min(uShadowAmt * 1.5, 1.0) : 0.0;
  over(acc, vec3(0.07, 0.04, 0.1), sa);

  float fz = fuzz(p);
  float edge = minD + (uMat3 == 1 ? (fz - 0.5) * uFuzz3 * 5.0 * uPx : 0.0);
  float a = hit ? 1.0 : clamp(0.5 - edge / (1.2 * uPx), 0.0, 1.0);
  if (a > 0.0) {
    vec3 n = hit ? nW : vec3(0.0, 0.0, 1.0);
    vec3 alb = hit ? colHit : colNear;
    if (uMat3 == 1) alb *= 0.8 + 0.36 * fz;
    if (uMat3 == 0) alb *= 0.96 + 0.08 * vnoise(p / uPx * 0.5);
    float aoC = clamp(ao, 0.35, 1.0);
    float key = max(dot(n, L), 0.0) * mix(0.45, 1.0, clamp(sh, 0.0, 1.0));
    float fill = max(dot(n, normalize(FILL_DIR)), 0.0);
    vec3 light = vec3(0.36) * aoC + key * vec3(1.0, 0.93, 0.82) * 0.86 + fill * vec3(0.72, 0.76, 1.0) * 0.26;
    vec3 col = alb * light;
    // Clay lets a little light through at the edges; plastic shines.
    if (uMat3 == 0) col += alb * 0.12 * pow(1.0 - max(n.z, 0.0), 2.0);
    if (uMat3 == 2) col += vec3(1.0, 0.97, 0.9) * 0.55 * pow(max(dot(reflect(-L, n), vec3(0.0, 0.0, 1.0)), 0.0), 28.0) * clamp(sh, 0.0, 1.0);
    over(acc, col, a);
  }
  outColor = acc;
}`;

  // ---------- the same geometry in JS, for bounds, handles and clicks ----------
  const turnOf = (el) => ({ yaw: el.yaw || 0, pitch: el.pitch || 0, squash: el.squash ?? 1 });
  function reach(part) {
    const len = (v) => Math.hypot(v[0], v[1], v[2]);
    const r = part.r ?? 0.03;
    if (part.kind === "capsule") return Math.max(len(part.at) + r, len(part.to || part.at) + (part.r2 ?? r));
    if (part.kind === "box" || part.kind === "ellipsoid") return len(part.at) + len(part.size || [r, r, r]);
    return len(part.at) + r;
  }
  // Bounding radius around the sculpt's origin, in scene units (squash included).
  function bound(el) {
    const parts = (el.parts || []).filter((pt) => !pt.carve);
    const R = Math.max(0.01, ...parts.map(reach)) + (el.blend || 0) + 0.004;
    const sq = Math.max(0.2, turnOf(el).squash);
    return R * Math.max(1 / Math.sqrt(sq), sq);
  }
  // Sculpt coordinates to the piece's own 2D coordinates (before the item transform).
  function project(el, q) {
    const { yaw, pitch, squash } = turnOf(el);
    const cp = Math.cos(pitch), sp = Math.sin(pitch), cy = Math.cos(yaw), sy = Math.sin(yaw);
    // R = Ry(yaw) * Rx(pitch), as in the shader (column-major there).
    const x1 = q[0], y1 = cp * q[1] - sp * q[2], z1 = sp * q[1] + cp * q[2];
    const x2 = cy * x1 + sy * z1, z2 = -sy * x1 + cy * z1;
    const sq = Math.max(0.2, squash);
    return [x2 / Math.sqrt(sq), y1 * sq, z2 / Math.sqrt(sq)];
  }
  // A move in the view plane (2D, the piece's own coordinates) back into sculpt coordinates.
  function unproject(el, d2) {
    const { yaw, pitch, squash } = turnOf(el);
    const sq = Math.max(0.2, squash);
    const w = [d2[0] * Math.sqrt(sq), d2[1] / sq, 0];
    const cy = Math.cos(yaw), sy = Math.sin(yaw), cp = Math.cos(pitch), sp = Math.sin(pitch);
    const x1 = cy * w[0] - sy * w[2], z1 = sy * w[0] + cy * w[2];
    return [x1, cp * w[1] + sp * z1, -sp * w[1] + cp * z1];
  }
  // Is a 2D point (the piece's own coordinates) on the sculpt? Each part's outline, seen from the front.
  function hit(el, p) {
    for (const pt of el.parts || []) {
      if (pt.carve) continue;
      const a = project(el, pt.at);
      const r = pt.kind === "box" || pt.kind === "ellipsoid" ? Math.max(...(pt.size || [0.03, 0.03, 0.03])) : pt.r ?? 0.03;
      if (pt.kind === "capsule") {
        const b = project(el, pt.to || pt.at);
        const bx = b[0] - a[0], by = b[1] - a[1];
        const h = Math.max(0, Math.min(1, ((p[0] - a[0]) * bx + (p[1] - a[1]) * by) / Math.max(bx * bx + by * by, 1e-9)));
        if (Math.hypot(p[0] - a[0] - bx * h, p[1] - a[1] - by * h) <= (pt.r ?? 0.03) + ((pt.r2 ?? pt.r ?? 0.03) - (pt.r ?? 0.03)) * h) return true;
      } else if (Math.hypot(p[0] - a[0], p[1] - a[1]) <= r) return true;
    }
    return false;
  }

  LB.ELEMENTS.clay = {
    glsl: CLAY,
    project, unproject, hit, bound,
    bbox(el) {
      const R = bound(el), s = el.shadow || 0;
      return [-R, -R, R + 0.032 * s, R + 0.038 * s];
    },
    set(gl, u, el, xf) {
      const parts = (el.parts || []).slice(0, MAX);
      const P = new Float32Array(MAX * 4), A = new Float32Array(MAX * 3), B = new Float32Array(MAX * 3), Cc = new Float32Array(MAX * 3);
      parts.forEach((pt, i) => {
        const k = Math.max(0, KINDS.indexOf(pt.kind));
        const r = pt.r ?? 0.03;
        P.set([k, pt.carve ? 1 : 0, k === 2 ? Math.min(r, ...(pt.size || [r, r, r])) : r, pt.r2 ?? r], i * 4);
        A.set(pt.at || [0, 0, 0], i * 3);
        B.set(k === 1 ? pt.to || pt.at || [0, 0, 0] : pt.size || [r, r, r], i * 3);
        Cc.set(rgb(pt.color || "#C9785A"), i * 3);
      });
      gl.uniform1i(u.uCount, parts.length);
      gl.uniform4fv(u.uPart, P);
      gl.uniform3fv(u.uPA, A);
      gl.uniform3fv(u.uPB, B);
      gl.uniform3fv(u.uPCol, Cc);
      gl.uniform1f(u.uBlend, el.blend ?? 0.012);
      const t = turnOf(el);
      gl.uniform3f(u.uTurn, t.yaw, t.pitch, t.squash);
      gl.uniform1f(u.uBound, bound(el));
      gl.uniform1i(u.uMat3, Math.max(0, MATS.indexOf(el.material)));
      gl.uniform1f(u.uDent, (el.dents ?? 0.5) * 0.004);
      gl.uniform1f(u.uFuzz3, el.fuzz ?? 0.6);
      const s = el.shadow || 0;
      gl.uniform1f(u.uShadowAmt, s);
      const r = (xf && xf.r) || 0, k = (xf && xf.s) || 1, ox = 0.012 * s, oy = 0.018 * s;
      gl.uniform2f(u.uShadowOff, (Math.cos(r) * ox + Math.sin(r) * oy) / k, (-Math.sin(r) * ox + Math.cos(r) * oy) / k);
      gl.uniform1i(u.uSteps, 240);
    },
  };

  LB.CLAY = { KINDS, MATS, MAX, project, unproject, hit, bound };
})();

</script>
<script data-src="js/items.js">
/*
  Geometry for the things painted into a layer ("items"), shared by the
  renderer and the editor.

  Every item can carry a transform, xf = { x, y, s, r }: move by (x, y),
  scale by s and rotate by r radians, around the item's origin. The origin
  is (0, 0) for shapes and images, which are drawn around it, and the
  center of the item's own bounding box for everything else. The bake
  shaders undo the transform in scenePos(), so no element needs to know it.

  Poses: a layer with a pose cycle (layer.cycle = { frames, rate }) bakes one
  texture per pose. Its items can list "poses", one per frame: changes added
  on top of the item's own transform ({ x, y, r } added, { s } multiplied),
  or { hide: true }. Moving an item moves all its poses with it.

  Item kinds:
    { el: "canopy" | "shape" | ... }   a reusable element (js/elements.js, js/shapes.js)
    { shader: "sky" }                  a bespoke shader from a scene's art pack; it covers the layer's rect
*/
(function () {
  const LB = (window.LB = window.LB || {});
  const IDENTITY = { x: 0, y: 0, s: 1, r: 0 };

  const xfOf = (item) => ({ ...IDENTITY, ...(item.xf || {}) });
  const isIdentity = (item) => {
    const t = xfOf(item);
    return t.x === 0 && t.y === 0 && t.s === 1 && t.r === 0;
  };

  // The item's box before its transform. Bespoke shaders cover the layer's own rect.
  function rawBox(item, layer) {
    if (item.el) return LB.ELEMENTS[item.el].bbox(item);
    return (layer && layer.rect) || [0, 0, (LB.ED && LB.ED.doc && LB.ED.doc.aspect) || 16 / 9, 1];
  }

  function origin(item, layer) {
    if (item.el === "shape" || item.el === "image") return [0, 0];
    const b = rawBox(item, layer);
    return [(b[0] + b[2]) / 2, (b[1] + b[3]) / 2];
  }

  // Item coordinates to scene coordinates.
  function toScene(item, layer, p, o = origin(item, layer), t = xfOf(item)) {
    const dx = (p[0] - o[0]) * t.s, dy = (p[1] - o[1]) * t.s;
    const c = Math.cos(t.r), s = Math.sin(t.r);
    return [o[0] + t.x + c * dx - s * dy, o[1] + t.y + s * dx + c * dy];
  }

  // Scene coordinates to item coordinates (the same math as scenePos() in the shaders).
  function toLocal(item, layer, p) {
    const o = origin(item, layer), t = xfOf(item);
    const dx = p[0] - o[0] - t.x, dy = p[1] - o[1] - t.y;
    const c = Math.cos(t.r), s = Math.sin(t.r);
    return [o[0] + (c * dx + s * dy) / t.s, o[1] + (-s * dx + c * dy) / t.s];
  }

  // The four corners of a box, carried through the transform.
  function corners(item, layer, box = rawBox(item, layer)) {
    const o = origin(item, layer), t = xfOf(item);
    return [[box[0], box[1]], [box[2], box[1]], [box[2], box[3]], [box[0], box[3]]].map((p) => toScene(item, layer, p, o, t));
  }

  function worldBox(item, layer) {
    const pts = corners(item, layer);
    const xs = pts.map((p) => p[0]), ys = pts.map((p) => p[1]);
    return [Math.min(...xs), Math.min(...ys), Math.max(...xs), Math.max(...ys)];
  }

  // The box a person thinks of as the item: a shape's outline without its shadow.
  function outlineBox(item, layer) {
    if (item.el === "shape") return LB.ELEMENTS.shape.outline(item);
    return rawBox(item, layer);
  }

  // Where the item's center is in the scene: what the editor shows as its position.
  function position(item, layer) {
    const o = origin(item, layer), t = xfOf(item);
    return [o[0] + t.x, o[1] + t.y];
  }

  // Is a scene point on this item? Exact for shapes and lobes, the outline box for everything else.
  function hit(item, layer, p) {
    const q = toLocal(item, layer, p);
    const b = outlineBox(item, layer);
    if (q[0] < b[0] || q[0] > b[2] || q[1] < b[1] || q[1] > b[3]) return false;
    if (item.el === "clay") return LB.ELEMENTS.clay.hit(item, q);
    if (item.el === "shape" && item.shape === "mask") {
      const m = LB.maskInfo && LB.maskInfo(LB.ELEMENTS.shape.maskKey(item));
      if (!m) return true;
      const u = (q[0] - b[0]) / (b[2] - b[0]), v = (q[1] - b[1]) / (b[3] - b[1]);
      return !!m.bin[Math.min(m.h - 1, Math.floor(v * m.h)) * m.w + Math.min(m.w - 1, Math.floor(u * m.w))];
    }
    if (item.el === "shape" && item.shape === "path" && item.points) {
      // Even-odd test against the outline.
      let inside = false;
      const ps = LB.ELEMENTS.shape.pathPoints(item);
      for (let i = 0, j = ps.length - 1; i < ps.length; j = i++) {
        if ((ps[i][1] > q[1]) !== (ps[j][1] > q[1]) && q[0] < ((ps[j][0] - ps[i][0]) * (q[1] - ps[i][1])) / (ps[j][1] - ps[i][1]) + ps[i][0]) inside = !inside;
      }
      return inside;
    }
    const lobes = item.lobes;
    if (lobes && (item.el !== "shape" || item.shape === "blob")) return lobes.some((l) => Math.hypot(q[0] - l[0], q[1] - l[1]) <= l[2] * 1.05);
    if (item.el === "shape" && item.shape === "ellipse") {
      const hx = (b[2] - b[0]) / 2, hy = (b[3] - b[1]) / 2;
      return (q[0] / hx) ** 2 + (q[1] / hy) ** 2 <= 1.05;
    }
    return true;
  }

  // The images an item samples, so they can be loaded before it bakes.
  function images(item) {
    const E = item.el && LB.ELEMENTS[item.el];
    return E && E.images ? E.images(item) : [];
  }

  // The item as it stands in pose f (unchanged when it has no poses).
  function atPose(item, f) {
    // Boil photos swap pose by pose, whether or not the item has poses of its own.
    if (item.boilImages && item.boilImages.length && item.image) {
      const all = [item.image, ...item.boilImages];
      item = { ...item, image: all[((f % all.length) + all.length) % all.length] };
    }
    if (!item.poses || !item.poses.length) return item;
    const p = item.poses[((f % item.poses.length) + item.poses.length) % item.poses.length] || {};
    const t = xfOf(item);
    const out = { ...item, xf: { x: t.x + (p.x || 0), y: t.y + (p.y || 0), s: t.s * (p.s ?? 1), r: t.r + (p.r || 0) }, hide: !!p.hide };
    // 3D clay pieces can also turn, tilt and squash from pose to pose.
    if (p.yaw) out.yaw = (item.yaw || 0) + p.yaw;
    if (p.pitch) out.pitch = (item.pitch || 0) + p.pitch;
    if (p.squash) out.squash = (item.squash ?? 1) * p.squash;
    return out;
  }

  // Bounds over every pose, so a layer's texture fits all of them.
  function allPosesBox(item, layer) {
    if (!item.poses || !item.poses.length) return worldBox(item, layer);
    let b = null;
    for (let f = 0; f < item.poses.length; f++) b = union(b, worldBox(atPose(item, f), layer));
    return b;
  }

  const union = (a, b) => (a ? [Math.min(a[0], b[0]), Math.min(a[1], b[1]), Math.max(a[2], b[2]), Math.max(a[3], b[3])] : b.slice());

  LB.ITEMS = { atPose, allPosesBox, IDENTITY, xfOf, isIdentity, rawBox, origin, toScene, toLocal, corners, worldBox, outlineBox, position, hit, images, union };
})();

</script>
<script data-src="js/post.js">
/*
  Post-processing shaders, in the order the recipe applies them:

    depth softness  blur the far layers before the near ones are drawn
    bloom           a downsample/upsample chain (dual filter) at half
                    resolution and below. Two uses: "glow" adds back what's
                    above a threshold, "mist" screens the whole wide blur
                    over the frame. Mist is the fuzz: blacks lift and every
                    edge gets a soft halo, like a Pro-Mist filter.
    halation        a warm fringe just outside bright areas
    grade           exposure, white balance, contrast, saturation, split
                    toning, then the output range (lifted floor, capped white)
    chromatic ab.   red and blue sampled slightly apart, growing to the edges
    vignette        tinted, not black
    grain           per rendered frame or per beat

  The last five run in one full-screen shader, but each stage has its own
  switch, so the panel and the screenshots can add them one at a time.
  Everything works on display-referred (sRGB) values, the way a colorist's
  grade works on the image it sees.
*/
(function () {
  const LB = (window.LB = window.LB || {});

  const COPY = `
in vec2 vUv;
uniform sampler2D uTex;
out vec4 outColor;
void main() { outColor = texture(uTex, vUv); }`;

  // Separable Gaussian, 9 taps folded into 5 linear samples.
  const BLUR = `
in vec2 vUv;
uniform sampler2D uTex;
uniform vec2 uDir;
out vec4 outColor;
void main() {
  vec4 c = texture(uTex, vUv) * 0.2270270270;
  c += (texture(uTex, vUv + uDir * 1.3846153846) + texture(uTex, vUv - uDir * 1.3846153846)) * 0.3162162162;
  c += (texture(uTex, vUv + uDir * 3.2307692308) + texture(uTex, vUv - uDir * 3.2307692308)) * 0.0702702703;
  outColor = c;
}`;

  const DOWN = `
in vec2 vUv;
uniform sampler2D uTex;
uniform vec2 uTexel;
out vec4 outColor;
void main() {
  vec2 h = uTexel * 0.5;
  vec4 s = texture(uTex, vUv) * 4.0;
  s += texture(uTex, vUv - h) + texture(uTex, vUv + h);
  s += texture(uTex, vUv + vec2(h.x, -h.y)) + texture(uTex, vUv + vec2(-h.x, h.y));
  outColor = s / 8.0;
}`;

  // Upsample the smaller level and add it, weighted, onto this level's downsample.
  const UP = `
in vec2 vUv;
uniform sampler2D uTex;
uniform sampler2D uBase;
uniform vec2 uTexel;
uniform float uWeight;
out vec4 outColor;
void main() {
  vec2 h = uTexel * 0.5;
  vec4 s = texture(uTex, vUv + vec2(-h.x * 2.0, 0.0)) + texture(uTex, vUv + vec2(h.x * 2.0, 0.0));
  s += texture(uTex, vUv + vec2(0.0, h.y * 2.0)) + texture(uTex, vUv + vec2(0.0, -h.y * 2.0));
  s += (texture(uTex, vUv + vec2(-h.x, h.y)) + texture(uTex, vUv + vec2(h.x, h.y))) * 2.0;
  s += (texture(uTex, vUv + vec2(h.x, -h.y)) + texture(uTex, vUv + vec2(-h.x, -h.y))) * 2.0;
  outColor = texture(uBase, vUv) + uWeight * s / 12.0;
}`;

  const FINAL = `
in vec2 vUv;
uniform sampler2D uScene, uBloom, uHal;
uniform float uBloomNorm;
uniform vec4 uOn;    // bloom, halation, grade, chromatic aberration
uniform vec2 uOn2;   // vignette, grain
uniform float uGlow, uThreshold, uMist;
uniform float uHalAmount, uHalThreshold;
uniform vec3 uHalColor;
uniform float uExposure, uTemp, uTint, uContrast, uSat, uWhiteCap, uRedCap, uSplit;
uniform vec3 uFloor, uShadowTint, uHighTint;
uniform float uCa, uVig, uGrain, uGrainSeed;
uniform vec3 uVigColor;
uniform vec2 uRes;
uniform vec4 uSway;  // lean (radians), zoom, double-vision offset
uniform float uGhost, uEdge;
out vec4 outColor;

float luma(vec3 c) { return dot(c, vec3(0.2126, 0.7152, 0.0722)); }
float hash(vec2 p) {
  vec3 p3 = fract(vec3(p.xyx) * 0.1031);
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.x + p3.y) * p3.z);
}

vec3 fringed(sampler2D t, vec2 uv, vec2 off) {
  return uOn.w > 0.5 ? vec3(texture(t, uv + off).r, texture(t, uv).g, texture(t, uv - off).b) : texture(t, uv).rgb;
}

void main() {
  vec2 uv = vUv;
  // Tipsy camera: lean and zoom about the middle, in screen proportions so nothing skews.
  if (uSway.y != 1.0 || uSway.x != 0.0) {
    vec2 asp = vec2(uRes.x / uRes.y, 1.0);
    vec2 q = (uv - 0.5) * asp / uSway.y;
    float c = cos(uSway.x), s = sin(uSway.x);
    uv = vec2(c * q.x - s * q.y, s * q.x + c * q.y) / asp + 0.5;
  }
  vec2 fromC = uv - 0.5;
  vec2 off = fromC * length(fromC) * uCa * 8.0;
  vec3 col = fringed(uScene, uv, off);
  vec3 bl = fringed(uBloom, uv, off);
  if (uGhost > 0.0) {
    // Double vision: a second, offset copy of the frame.
    col = mix(col, fringed(uScene, uv + uSway.zw, off), uGhost);
    bl = mix(bl, fringed(uBloom, uv + uSway.zw, off), uGhost);
  }
  bl /= uBloomNorm;
  // Blurry edges: toward the sides the frame gives way to its own blurred copy (the bloom chain's).
  if (uEdge > 0.0) {
    float e = smoothstep(0.18, 0.62, length(fromC * vec2(uRes.x / uRes.y, 1.0) * 0.75));
    col = mix(col, bl, e * uEdge);
  }

  if (uOn.x > 0.5) {
    col += uGlow * max(bl - uThreshold, 0.0) / max(1.0 - uThreshold, 0.01);
    col = 1.0 - (1.0 - clamp(col, 0.0, 1.0)) * (1.0 - bl * uMist);
  }

  if (uOn.y > 0.5) {
    float h = smoothstep(uHalThreshold, 1.0, luma(texture(uHal, uv).rgb));
    float fringe = h * (1.0 - smoothstep(0.35, 0.85, luma(col)));
    col += uHalColor * fringe * uHalAmount;
  }

  if (uOn.z > 0.5) {
    col *= exp2(uExposure);
    col *= vec3(1.0 + 0.12 * uTemp, 1.0 + 0.015 * uTemp, 1.0 - 0.15 * uTemp);
    col *= vec3(1.0 + 0.04 * uTint, 1.0 - 0.07 * uTint, 1.0 + 0.04 * uTint);
    col = (col - 0.5) * uContrast + 0.5;
    col = mix(vec3(luma(col)), col, uSat);
    float l = clamp(luma(col), 0.0, 1.0);
    col = mix(col, col * uHighTint, smoothstep(0.3, 1.0, l) * uSplit * 1.6);
    col = mix(col, uShadowTint, (1.0 - smoothstep(0.0, 0.55, l)) * uSplit * 0.6);
    // Soft shoulder above 0.8 so bright areas roll off instead of clipping.
    col = max(col, 0.0);
    vec3 sh = 1.0 - 0.2 * exp(-(col - 0.8) / 0.2);
    col = mix(col, sh, step(0.8, col));
    col = uFloor + col * (vec3(uWhiteCap) - uFloor);
    col.r = min(col.r, uRedCap);
  }

  if (uOn2.x > 0.5) {
    vec2 q = fromC * vec2(uRes.x / uRes.y, 1.0);
    float v = smoothstep(0.35, 1.05, length(q)) * uVig;
    col = mix(col, col * uVigColor, v);
  }

  if (uOn2.y > 0.5) {
    float n = hash(gl_FragCoord.xy + uGrainSeed * 61.7) + hash(gl_FragCoord.xy * 1.37 + uGrainSeed * 13.1) - 1.0;
    float l = luma(col);
    col += n * uGrain * (0.6 + 0.4 * (1.0 - abs(l * 2.0 - 1.0)));
  }

  col += (hash(gl_FragCoord.xy + 0.5) - 0.5) / 255.0; // dither, so gradients don't band
  outColor = vec4(clamp(col, 0.0, 1.0), 1.0);
}`;

  LB.POST_GLSL = { COPY, BLUR, DOWN, UP, FINAL };
  // The order the stages switch on in, for "?upto=" and the screenshots.
  LB.PASSES = ["depth", "bloom", "halation", "grade", "ca", "vignette", "grain", "sway"];
})();

</script>
<script data-src="js/renderer.js">
/*
  The renderer: bakes a scene's layers into textures, then composites them
  every beat and runs the post stack.

  Baking: each layer's paint list (bespoke art shaders, reusable elements,
  shapes and images) is drawn into its texture, each item only over its own
  bounding box. Cycle animations bake one texture per frame. Bake programs
  compile once, in parallel where the browser supports it, and are cached.

  Syncing: sync(scene) takes a new version of the scene and rebakes only
  the layers whose look changed. Moving a whole layer, changing its depth,
  boil, haze, motion or opacity, or hiding it needs no rebake at all. That
  is what lets the editor change one thing and see it on the next frame.

  Per beat: every layer is one textured quad, drawn back to front with
  premultiplied alpha. Its position comes from camera drift times its depth
  (parallax), plus its own offset and animation (drift, sway or a cycle of
  baked frames). Boil wobbles each layer's texture lookup with a smooth
  noise that changes seed on the beat.

  Focus: "far" layers are drawn first and blurred together; "near" layers
  (things right by the lens) are drawn last, on their own, and blurred much
  harder, so whatever sits between them is what's in focus.

  Work is only done when something changes: the scene and the bloom chain
  re-render on a new beat or a new setting, and the final pass re-runs every
  display frame only when grain is set to change per frame.
*/
(function () {
  const LB = (window.LB = window.LB || {});
  const G = () => LB.gl;
  const TAU = Math.PI * 2;

  const LAYER_VERT = `
in vec2 aPos;
uniform vec4 uRect;
uniform vec2 uPivot;
uniform float uAngle;
uniform vec2 uOffset;
uniform vec4 uView;
out vec2 vUv;
void main() {
  vUv = aPos;
  vec2 p = mix(uRect.xy, uRect.zw, aPos);
  vec2 d = p - uPivot;
  float c = cos(uAngle), s = sin(uAngle);
  p = uPivot + vec2(c * d.x - s * d.y, s * d.x + c * d.y) + uOffset;
  vec2 n = (p - uView.xy) / uView.zw;
  gl_Position = vec4(n.x * 2.0 - 1.0, 1.0 - n.y * 2.0, 0.0, 1.0);
}`;

  const LAYER_FRAG = `
in vec2 vUv;
uniform sampler2D uTex, uNoise;
uniform vec2 uBoilScale, uBoilSeed, uBoilAmp;
uniform vec3 uHaze;
uniform float uHazeAmt, uAlpha;
out vec4 outColor;
void main() {
  vec2 n = texture(uNoise, vUv * uBoilScale + uBoilSeed).rg - 0.5;
  vec4 c = texture(uTex, vUv + n * uBoilAmp);
  c.rgb = mix(c.rgb, uHaze * c.a, uHazeAmt);
  outColor = c * uAlpha;
}`;

  // Sparkles: one instanced draw. Each twinkles 1-3 times per loop, so the loop stays seamless.
  const SPARKLE_VERT = `
in vec2 aPos;
uniform vec4 uArea, uView;
uniform vec2 uOffset;
uniform float uSize, uTime, uLoop, uJitter;
out vec2 vUv;
out float vBright;
float h1(float n) { return fract(sin(n * 127.1) * 43758.5453); }
void main() {
  float i = float(gl_InstanceID);
  vec2 c = mix(uArea.xy, uArea.zw, vec2(h1(i + 1.3), h1(i + 7.9)));
  float k = floor(1.0 + h1(i + 3.1) * 3.0);
  float tw = sin(6.2831853 * (uTime / uLoop * k + h1(i + 5.7)));
  vBright = pow(max(tw, 0.0), 5.0);
  float s = uSize * (0.6 + 0.8 * h1(i + 9.2)) * (0.6 + 0.4 * vBright);
  vec2 jit = (vec2(h1(i + uJitter * 3.3), h1(i + uJitter * 5.1 + 2.0)) - 0.5) * uSize * 0.3;
  vec2 p = c + jit + (aPos - 0.5) * s * 2.0 + uOffset;
  vUv = aPos * 2.0 - 1.0;
  vec2 n = (p - uView.xy) / uView.zw;
  gl_Position = vec4(n.x * 2.0 - 1.0, 1.0 - n.y * 2.0, 0.0, 1.0);
}`;
  const SPARKLE_FRAG = `
in vec2 vUv;
in float vBright;
uniform vec3 uColor;
uniform float uAlpha;
out vec4 outColor;
void main() {
  float r = length(vUv);
