  float core = exp(-r * r * 9.0);
  float star = exp(-abs(vUv.x) * 16.0) * exp(-abs(vUv.y) * 2.6) + exp(-abs(vUv.y) * 16.0) * exp(-abs(vUv.x) * 2.6);
  float a = clamp((core + star * 0.55) * vBright, 0.0, 1.0) * uAlpha;
  outColor = vec4(uColor * a, a * 0.85);
}`;

  // Layer fields that only change how a baked layer is placed and blended, never what's in it.
  const COMPOSITE_KEYS = new Set(["baseRect", "order", "sig", "id", "name", "depth", "boil", "haze", "far", "near", "offset", "opacity", "hidden", "locked", "pivot", "anim", "index", "note", "groups", "group"]);
  // Scene bounds a layer's texture may cover (the frame plus room for parallax and dragging past the edge).
  const limitOf = (scene) => [-0.35, -0.35, (scene.aspect || 16 / 9) + 0.35, 1.35];

  // Deterministic per-beat randomness for boil.
  function rand(n) {
    const x = Math.sin(n * 12.9898 + 78.233) * 43758.5453;
    return x - Math.floor(x);
  }

  function createRenderer(canvas, initialScene, opts = {}) {
    const gl = canvas.getContext("webgl2", {
      alpha: false, antialias: false, depth: false, stencil: false,
      premultipliedAlpha: false, preserveDrawingBuffer: !!opts.preserve, powerPreference: "high-performance",
    });
    if (!gl) throw new Error("WebGL2 is not available");
    const { program, target, freeTarget, quad, bindTarget, bindTex, rgb, texture, FULLSCREEN_VERT } = G();
    const I = LB.ITEMS;
    const P = LB.POST_GLSL;
    const maxTex = gl.getParameter(gl.MAX_TEXTURE_SIZE);
    const vao = quad(gl);

    const progs = {
      layer: program(gl, LAYER_VERT, LAYER_FRAG, "layer"),
      sparkle: program(gl, SPARKLE_VERT, SPARKLE_FRAG, "sparkle"),
      copy: program(gl, FULLSCREEN_VERT, P.COPY, "copy"),
      blur: program(gl, FULLSCREEN_VERT, P.BLUR, "blur"),
      down: program(gl, FULLSCREEN_VERT, P.DOWN, "down"),
      up: program(gl, FULLSCREEN_VERT, P.UP, "up"),
      final: program(gl, FULLSCREEN_VERT, P.FINAL, "final"),
    };

    // Boil noise: 64x64 random values, smoothed by linear filtering. One texel = one boil wavelength.
    const noiseData = new Uint8Array(64 * 64 * 4);
    for (let i = 0; i < noiseData.length; i++) noiseData[i] = Math.floor(rand(i * 1.618 + 3) * 256);
    const noiseTex = texture(gl, 64, 64, { data: noiseData, repeat: true });
    // Bound wherever a bake shader has a sampler but no image to read.
    const whiteTex = texture(gl, 1, 1, { data: new Uint8Array([255, 255, 255, 255]) });

    const quality = opts.quality || "high";
    const bloomLevels = quality === "low" ? 3 : 5;
    // Bake density, in texture px per scene unit. Fixed at load, from the screen, so resizing never re-bakes.
    const density = Math.min(quality === "low" ? 720 : 1200, Math.max(540, Math.round(opts.bakeHeight || 1080)));

    let scene = initialScene;
    let layers = [];
    let W = 0, H = 0;
    let view = [0, 0, 1, 1];
    let rt = {};
    let post = null;
    let lastBeat = -1, dirty = true, baked = false;
    let grade = scene.grades ? scene.grades[scene.grade] : null;

    const progCache = new Map();  // bake program key -> compiled program
    const layerCache = new Map(); // layer id -> { sig, textures, texSize }
    const imageCache = new Map(); // image id -> { tex, w, h, img }
    const maskCache = new Map();  // mask key -> { tex, w, h, bin }
    LB.imageInfo = (id) => imageCache.get(id);
    LB.maskInfo = (key) => maskCache.get(key);

    // ---------- what each layer needs ----------
    const art = () => (scene.art && LB.art ? LB.art[scene.art] : null);
    const paintOf = (L) => (L.type === "sprite" ? [{ sprite: true }] : L.paint || []);
    const progKey = (item) => (item.sprite ? "sprite" : item.shader ? "art:" + item.shader : "el:" + item.el);
    function progSource(key) {
      const [kind, name] = key.split(":");
      let body;
      if (kind === "sprite") body = LB.SPRITE.glsl;
      else if (kind === "art") body = art() && art().bakes[name];
      else body = LB.ELEMENTS[name] && LB.ELEMENTS[name].glsl;
      if (!body) throw new Error(`Nothing draws "${key}"`);
      return LB.MATERIALS_GLSL + body;
    }

    // The scene rect a layer's texture covers. Scene files can give one; otherwise it's the
    // union of what the layer paints. Items moved out of a given rect stretch it to follow.
    function layerRect(L) {
      if (L.type === "sprite") return LB.SPRITE.bbox(L);
      const LIMIT = limitOf(scene);
      let r = L.rect ? L.rect.slice() : null;
      for (const item of L.paint || []) {
        if (item.shader && !L.rect) r = I.union(r, LIMIT);
        else if (!L.rect || !I.isIdentity(item) || item.poses) r = I.union(r, I.allPosesBox(item, L));
      }
      r = r || [0, 0, 0.01, 0.01];
      return [Math.max(r[0], LIMIT[0]), Math.max(r[1], LIMIT[1]), Math.min(r[2], LIMIT[2]), Math.min(r[3], LIMIT[3])];
    }

    // How many textures a layer bakes: one per pose in a pose cycle, or per frame of a cycle animation.
    const bakeFrames = (L) => (L.cycle ? L.cycle.frames : L.anim && L.anim.type === "cycle" ? L.anim.frames : 1);

    function signature(L) {
      const frames = bakeFrames(L);
      return JSON.stringify(L, (k, v) => (COMPOSITE_KEYS.has(k) ? undefined : v)) + "|" + frames + "|" + L.index + "|" + scene.art;
    }

    function prepare(L, i) {
      // "index" seeds the boil and the bake noise. A layer can pin it with "seed" so reordering layers never changes how one looks.
      const l = { ...L, index: L.seed ?? i, order: i, baseRect: L.rect };
      if (l.type !== "sparkles") {
        l.rect = layerRect(L);
        l.sig = signature(l);
        const cached = layerCache.get(l.id);
        if (cached && cached.sig === l.sig) {
          l.textures = cached.textures;
          l.texSize = cached.texSize;
        }
      }
      return l;
    }

    // ---------- images ----------
    function loadImage(id, src) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => {
          const tex = texture(gl, 1, 1, { repeat: true });
          gl.bindTexture(gl.TEXTURE_2D, tex);
          gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);
          gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE, img);
          imageCache.set(id, { tex, w: img.naturalWidth, h: img.naturalHeight, src, img });
          // A changed picture means its cut-outs have to be rebuilt.
          for (const k of [...maskCache.keys()]) if (k.startsWith(id + "|")) { gl.deleteTexture(maskCache.get(k).tex); maskCache.delete(k); }
          resolve();
        };
        img.onerror = () => reject(new Error(`Image "${id}" didn't load`));
        img.src = src;
      });
    }
    async function ensureImages(list) {
      const want = new Set();
      for (const L of list) for (const item of L.paint || []) I.images(item).forEach((id) => want.add(id));
      const jobs = [];
      for (const id of want) {
        const def = scene.images && scene.images[id];
        if (!def) continue;
        const have = imageCache.get(id);
        if (have && have.src === def.src) continue;
        if (have) gl.deleteTexture(have.tex);
        jobs.push(loadImage(id, def.src));
      }
      await Promise.all(jobs);
    }

    // ---------- cut-outs from pictures ----------
    // A picture becomes a signed distance field: which pixels count as "inside" (the dark parts, the
    // light parts, or the opaque parts), then how far each pixel is from the edge, in pixels.
    // Exact Euclidean distances, by Felzenszwalb and Huttenlocher's two-pass method.
    function edt1(f, n, d, v, z) {
      let k = 0;
      v[0] = 0; z[0] = -Infinity; z[1] = Infinity;
      for (let q = 1; q < n; q++) {
        let s = ((f[q] + q * q) - (f[v[k]] + v[k] * v[k])) / (2 * q - 2 * v[k]);
        while (s <= z[k]) { k--; s = ((f[q] + q * q) - (f[v[k]] + v[k] * v[k])) / (2 * q - 2 * v[k]); }
        k++; v[k] = q; z[k] = s; z[k + 1] = Infinity;
      }
      k = 0;
      for (let q = 0; q < n; q++) { while (z[k + 1] < q) k++; d[q] = (q - v[k]) * (q - v[k]) + f[v[k]]; }
    }
    function edt(grid, w, h) {
      const n = Math.max(w, h), f = new Float64Array(n), d = new Float64Array(n), v = new Int32Array(n), z = new Float64Array(n + 1);
      for (let x = 0; x < w; x++) {
        for (let y = 0; y < h; y++) f[y] = grid[y * w + x];
        edt1(f, h, d, v, z);
        for (let y = 0; y < h; y++) grid[y * w + x] = d[y];
      }
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) f[x] = grid[y * w + x];
        edt1(f, w, d, v, z);
        for (let x = 0; x < w; x++) grid[y * w + x] = d[x];
      }
    }
    function buildMask(def) {
      const info = imageCache.get(def.image);
      if (!info) return;
      const k = Math.min(1, 256 / Math.max(info.w, info.h));
      const w = Math.max(2, Math.round(info.w * k)), h = Math.max(2, Math.round(info.h * k));
      const c = document.createElement("canvas");
      c.width = w; c.height = h;
      const x = c.getContext("2d", { willReadFrequently: true });
      x.drawImage(info.img, 0, 0, w, h);
      const px = x.getImageData(0, 0, w, h).data;
      const bin = new Uint8Array(w * h);
      for (let i = 0; i < w * h; i++) {
        const a = px[i * 4 + 3] / 255;
        const lum = (0.299 * px[i * 4] + 0.587 * px[i * 4 + 1] + 0.114 * px[i * 4 + 2]) / 255;
        const m = def.from === "dark" ? (1 - lum) * a : def.from === "light" ? lum * a : a;
        bin[i] = m > def.threshold ? 1 : 0;
      }
      const BIG = 1e12;
      const toIn = new Float64Array(w * h), toOut = new Float64Array(w * h);
      for (let i = 0; i < w * h; i++) { toIn[i] = bin[i] ? 0 : BIG; toOut[i] = bin[i] ? BIG : 0; }
      edt(toIn, w, h);
      edt(toOut, w, h);
      const data = new Uint8Array(w * h * 4);
      for (let i = 0; i < w * h; i++) {
        // Positive outside, negative inside, the edge halfway between pixels.
        const dist = bin[i] ? -(Math.sqrt(toOut[i]) - 0.5) : Math.sqrt(toIn[i]) - 0.5;
        const val = Math.max(0, Math.min(255, Math.round(128 + dist * 4)));
        data[i * 4] = data[i * 4 + 1] = data[i * 4 + 2] = val;
        data[i * 4 + 3] = 255;
      }
      const tex = texture(gl, w, h, { data });
      maskCache.set(def.key, { tex, w, h, bin });
    }
    function ensureMasks(list) {
      for (const L of list) for (const item of L.paint || []) {
        const E = item.el && LB.ELEMENTS[item.el];
        if (!E || !E.masks) continue;
        for (const def of E.masks(item)) if (!maskCache.has(def.key)) buildMask(def);
      }
    }

    // ---------- programs ----------
    async function ensurePrograms(keys) {
      const missing = [...new Set(keys)].filter((k) => !progCache.has(k));
      if (!missing.length) return;
      const t0 = performance.now();
      const compiled = await LB.gl.programs(gl, missing.map((k) => [FULLSCREEN_VERT, progSource(k), "bake " + k]));
      missing.forEach((k, i) => progCache.set(k, compiled[i]));
      if (opts.timeBake) { gl.finish(); console.log(`compile ${missing.length} bake programs: ${(performance.now() - t0).toFixed(0)}ms`); }
    }

    // ---------- baking ----------
    // Paints a layer's items into the currently bound target, which covers "rect" at w x h px.
    function paintLayer(L, rect, w, h, frame) {
      const [rx0, ry0, rx1, ry1] = rect;
      const TILE = 512;
      // Bespoke shaders cover the rect the scene file gave, even when moved items have stretched the texture.
      const host = L.type === "sprite" ? L : { rect: L.baseRect || L.rect };
      paintOf(L).forEach((item0, pi) => {
        const item = item0.sprite ? item0 : I.atPose(item0, frame);
        if (item.hide) return;
        const pr = progCache.get(progKey(item));
        gl.useProgram(pr.prog);
        const t = item.sprite ? I.IDENTITY : I.xfOf(item);
        const o = item.sprite ? [0, 0] : I.origin(item, host);
        gl.uniform4f(pr.u.uRect, rx0, ry0, rx1, ry1);
        gl.uniform2f(pr.u.uRes, w, h);
        gl.uniform1f(pr.u.uPx, (ry1 - ry0) / h / t.s);
        gl.uniform1f(pr.u.uSeed, L.index * 1.37 + pi * 0.71);
        gl.uniform1f(pr.u.uFrame, frame);
        gl.uniform1i(pr.u.uN, item.n || 0);
        gl.uniform1i(pr.u.uOne, 1);
        gl.uniform4f(pr.u.uXf, t.x, t.y, t.s, t.r);
        gl.uniform2f(pr.u.uXfOrigin, o[0], o[1]);
        const imgs = item.sprite ? [] : I.images(item);
        const img = imgs.length && imageCache.get(imgs[0]);
        bindTex(gl, 0, img ? img.tex : whiteTex);
        gl.uniform1i(pr.u.uImage, 0);
        const mask = item.el === "shape" && item.shape === "mask" ? maskCache.get(LB.ELEMENTS.shape.maskKey(item)) : null;
        bindTex(gl, 1, mask ? mask.tex : whiteTex);
        gl.uniform1i(pr.u.uMask, 1);
        let box = rect;
        if (item.sprite) LB.SPRITE.set(gl, pr.u, L);
        else if (item.el) {
          LB.ELEMENTS[item.el].set(gl, pr.u, item, t);
          box = I.worldBox(item, host);
        } else if (!I.isIdentity(item)) box = I.worldBox(item, host);
        // Only touch the pixels this item can cover, in tiles so no single draw runs long.
        const px0 = Math.max(0, Math.floor(((box[0] - rx0) / (rx1 - rx0)) * w));
        const px1 = Math.min(w, Math.ceil(((box[2] - rx0) / (rx1 - rx0)) * w));
        const py0 = Math.max(0, Math.floor(((box[1] - ry0) / (ry1 - ry0)) * h));
        const py1 = Math.min(h, Math.ceil(((box[3] - ry0) / (ry1 - ry0)) * h));
        gl.enable(gl.SCISSOR_TEST);
        for (let y = py0; y < py1; y += TILE) {
          for (let x = px0; x < px1; x += TILE) {
            gl.scissor(x, y, Math.min(TILE, px1 - x), Math.min(TILE, py1 - y));
            gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
          }
        }
        gl.disable(gl.SCISSOR_TEST);
      });
    }

    async function bakeLayers(list, onProgress) {
      const t1 = performance.now();
      const jobs = [];
      for (const L of list) {
        const frames = bakeFrames(L);
        const res = L.res || 1;
        let w = (L.rect[2] - L.rect[0]) * density * res;
        let h = (L.rect[3] - L.rect[1]) * density * res;
        const shrink = Math.min(1, maxTex / Math.max(w, h));
        w = Math.max(1, Math.round(w * shrink));
        h = Math.max(1, Math.round(h * shrink));
        L.texSize = [w, h];
        L.textures = [];
        for (let f = 0; f < frames; f++) jobs.push({ L, f, w, h });
      }
      let lastYield = performance.now();
      gl.enable(gl.BLEND);
      gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
      gl.bindVertexArray(vao);
      for (let ji = 0; ji < jobs.length; ji++) {
        const { L, f, w, h } = jobs[ji];
        const t = target(gl, w, h);
        bindTarget(gl, t);
        gl.clearColor(0, 0, 0, 0);
        gl.clear(gl.COLOR_BUFFER_BIT);
        paintLayer(L, L.rect, w, h, f);
        gl.flush();
        L.textures.push(t.tex);
        gl.deleteFramebuffer(t.fb);
        if (performance.now() - lastYield > 30) {
          gl.disable(gl.BLEND);
          if (onProgress) onProgress(0.5 + 0.5 * (ji / jobs.length));
          await new Promise((r) => setTimeout(r, 0));
          gl.enable(gl.BLEND);
          gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
          gl.bindVertexArray(vao);
          lastYield = performance.now();
        }
      }
      gl.disable(gl.BLEND);
      if (opts.timeBake && jobs.length) { gl.finish(); console.log(`bake ${jobs.length} textures: ${(performance.now() - t1).toFixed(0)}ms`); }
    }

    async function applyScene(next, onProgress) {
      scene = next;
      const list = next.layers.map(prepare);
      const stale = list.filter((L) => L.type !== "sparkles" && !L.textures);
      if (stale.length) {
        await ensureImages(stale);
        ensureMasks(stale);
        await ensurePrograms(stale.flatMap((L) => paintOf(L).map(progKey)));
        if (onProgress) onProgress(0.5);
        await bakeLayers(stale, onProgress);
      }
      // Swap in the new list, then free textures nothing uses any more.
      const keep = new Set(list.flatMap((L) => L.textures || []));
      for (const c of layerCache.values()) for (const tex of c.textures) if (!keep.has(tex)) gl.deleteTexture(tex);
      layerCache.clear();
      for (const L of list) if (L.textures) layerCache.set(L.id, { sig: L.sig, textures: L.textures, texSize: L.texSize });
      layers = list;
      computeView();
      if (onProgress) onProgress(1);
      baked = true;
      dirty = true;
    }

    // Coalesces rapid edits: while one sync runs, only the newest scene waits behind it.
    let running = null, pending = null;
    function sync(next, onProgress) {
      pending = next;
      if (!running) {
        running = (async () => {
          try {
            while (pending) {
              const s = pending;
              pending = null;
              await applyScene(s, onProgress);
            }
          } finally {
            running = null;
          }
        })();
      }
      return running;
    }

    // ---------- sizing ----------
    function resize(w, h) {
      w = Math.max(2, Math.round(w));
      h = Math.max(2, Math.round(h));
      if (w === W && h === H) return;
      W = w; H = h;
      canvas.width = W;
      canvas.height = H;
      computeView();
      for (const k in rt) {
        if (Array.isArray(rt[k])) rt[k].forEach((t) => freeTarget(gl, t));
        else freeTarget(gl, rt[k]);
      }
      rt.scene = target(gl, W, H);
      rt.halfA = target(gl, W / 2, H / 2);
      rt.halfB = target(gl, W / 2, H / 2);
      rt.quarterA = target(gl, W / 4, H / 4);
      rt.quarterB = target(gl, W / 4, H / 4);
      rt.down = [];
      rt.up = [];
      for (let i = 0; i < bloomLevels; i++) {
        const s = Math.pow(2, i + 1);
        rt.down.push(target(gl, W / s, H / s));
        if (i < bloomLevels - 1) rt.up.push(target(gl, W / s, H / s));
      }
      dirty = true;
    }

    // Cover-fit the scene to the canvas. A wider canvas shows a band of the scene, a narrower one a
    // slice; either way the band or slice is centered on the scene's focus point, kept inside the frame.
    // The editor can pin the view to any scene rectangle (zoom and pan); null goes back to cover-fit.
    let viewOverride = null;
    function setView(v) { viewOverride = v ? v.slice() : null; computeView(); }
    function computeView() {
      if (!W || !H) return;
      if (viewOverride) { view = viewOverride.slice(); dirty = true; return; }
      const a = W / H, A = scene.aspect || 16 / 9;
      const focus = scene.focus || [A / 2, 0.5];
      if (a >= A) {
        const vh = A / a;
        view = [0, Math.min(Math.max(focus[1] - vh / 2, 0), 1 - vh), A, vh];
      } else {
        const vw = a;
        view = [Math.min(Math.max(focus[0] - vw / 2, 0), A - vw), 0, vw, 1];
      }
      dirty = true;
    }

    // ---------- settings ----------
    function setPost(p) { post = p; dirty = true; }
    function setGrade(g) { grade = g; dirty = true; }
    function invalidate() { dirty = true; }

    // ---------- drawing ----------
    function fullscreen(pr) {
      gl.useProgram(pr.prog);
      gl.bindVertexArray(vao);
      return pr.u;
    }
    function drawQuad() { gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4); }

    function cameraAt(t) {
      const d = scene.camera.drift;
      return post.motion ? [d[0] * Math.sin(TAU * t / LB.LOOP), d[1] * Math.sin(2 * TAU * t / LB.LOOP)] : [0, 0];
    }

    function pivotOf(L) {
      if (L.type === "sprite") return L.a;
      const [x0, y0, x1, y1] = L.rect;
      return L.pivot === "center" ? [(x0 + x1) / 2, (y0 + y1) / 2] : [(x0 + x1) / 2, y1];
    }

    function layerPose(L, t, seed, cam, jitter = true) {
      const loop = LB.LOOP;
      const off = L.offset || [0, 0];
      let ox = cam[0] * (L.depth || 0) + off[0], oy = cam[1] * (L.depth || 0) + off[1], angle = 0, frame = 0;
      const a = L.anim;
      if (a && post.motion) {
        if (a.type === "drift") {
          ox += a.amp[0] * Math.sin(TAU * t / loop);
          oy += a.amp[1] * Math.sin(2 * TAU * t / loop);
        } else if (a.type === "sway") {
          const k = a.speed || 1;
          angle = a.amp * Math.sin(TAU * k * t / loop + a.phase) + a.amp * 0.25 * Math.sin(3 * TAU * k * t / loop + a.phase * 1.7);
        } else if (a.type === "cycle") {
          frame = Math.floor(t * a.rate + 1e-6) % a.frames;
        } else if (a.type === "travel") {
          // Crosses from "from" to "to" a whole number of times per loop, bobbing a whole number of times per crossing.
          const f = (((t / loop) * (a.speed || 1) + (a.phase || 0)) % 1 + 1) % 1;
          ox += a.from[0] + (a.to[0] - a.from[0]) * f;
          oy += a.from[1] + (a.to[1] - a.from[1]) * f + (a.bob || 0) * Math.sin(TAU * f * (a.bobs || 4));
        }
      }
      if (L.cycle && post.motion) frame = Math.floor(t * L.cycle.rate + 1e-6) % L.cycle.frames;
      // Sprites also get a tiny per-beat nudge, like a puppet that never sits in exactly the same spot.
      if (jitter && L.type === "sprite" && post.boil > 0) {
        const k = post.boil * view[3] / 1080;
        angle += (rand(L.index * 31 + seed * 7) - 0.5) * 0.008 * post.boil;
        ox += (rand(L.index * 17 + seed * 3) - 0.5) * k;
        oy += (rand(L.index * 13 + seed * 5) - 0.5) * k;
      }
      return { ox, oy, angle, frame };
    }

    function drawLayers(list, t, seed, cam) {
      const u = progs.layer.u;
      gl.useProgram(progs.layer.prog);
      gl.bindVertexArray(vao);
      gl.uniform4f(u.uView, ...view);
      gl.uniform1i(u.uTex, 0);
      gl.uniform1i(u.uNoise, 1);
      bindTex(gl, 1, noiseTex);
      const haze = rgb(scene.horizon);
      gl.uniform3f(u.uHaze, ...haze);
      for (const L of list) {
        if (L.hidden || (post.hidden && post.hidden[L.id])) continue;
        if (L.type === "sparkles") {
          drawSparkles(L, t, seed, cam);
          gl.useProgram(progs.layer.prog);
          gl.bindVertexArray(vao);
          continue;
        }
        if (!L.textures || !L.textures.length) continue;
        const pose = layerPose(L, t, seed, cam);
        const [x0, y0, x1, y1] = L.rect;
        const pivot = pivotOf(L);
        gl.uniform4f(u.uRect, x0, y0, x1, y1);
        gl.uniform2f(u.uPivot, pivot[0], pivot[1]);
        gl.uniform1f(u.uAngle, pose.angle);
        gl.uniform2f(u.uOffset, pose.ox, pose.oy);
        // Boil: wavelength ~40px and amplitude in px, both measured at 1080p.
        const wl = 40 / 1080, amp = (L.boil || 0) * post.boil / 1080;
        gl.uniform2f(u.uBoilScale, (x1 - x0) / wl, (y1 - y0) / wl);
        gl.uniform2f(u.uBoilSeed, rand(seed * 3 + L.index) * 64, rand(seed * 5 + L.index + 0.5) * 64);
        gl.uniform2f(u.uBoilAmp, (amp * 2) / (x1 - x0), (amp * 2) / (y1 - y0));
        gl.uniform1f(u.uHazeAmt, (L.haze || 0) * post.haze);
        const n = L.textures.length;
        if (post.onion === L.id && n > 1) {
          gl.uniform1f(u.uAlpha, (L.opacity ?? 1) * 0.35);
          bindTex(gl, 0, L.textures[(pose.frame - 1 + n) % n]);
          drawQuad();
        }
        gl.uniform1f(u.uAlpha, L.opacity ?? 1);
        bindTex(gl, 0, L.textures[Math.min(pose.frame, n - 1)]);
        drawQuad();
      }
    }

    function drawSparkles(L, t, seed, cam) {
      const u = progs.sparkle.u;
      const off = L.offset || [0, 0];
      gl.useProgram(progs.sparkle.prog);
      gl.bindVertexArray(vao);
      gl.uniform4f(u.uArea, ...L.area);
      gl.uniform4f(u.uView, ...view);
      gl.uniform2f(u.uOffset, cam[0] * L.depth + off[0], cam[1] * L.depth + off[1]);
      gl.uniform1f(u.uSize, L.size);
      gl.uniform1f(u.uTime, post.motion ? t : 0.4);
      gl.uniform1f(u.uLoop, LB.LOOP);
      gl.uniform1f(u.uJitter, post.boil > 0 ? seed + 1 : 0);
      gl.uniform3f(u.uColor, ...rgb(L.color));
      gl.uniform1f(u.uAlpha, L.opacity ?? 1);
      gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, L.count);
    }

    function renderScene(clock) {
      const t = clock.beatTime, seed = clock.boilSeed;
      const cam = cameraAt(t);
      bindTarget(gl, rt.scene);
      const bg = rgb(scene.background || "#000000");
      gl.clearColor(bg[0], bg[1], bg[2], 1);
      gl.clear(gl.COLOR_BUFFER_BIT);
      gl.enable(gl.BLEND);
      gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
      drawLayers(layers.filter((L) => L.far), t, seed, cam);
      gl.disable(gl.BLEND);

      if (post.on.depth && post.depth.radius > 0) {
        // Downsample the far layers, blur them both ways, and put them back.
        bindTarget(gl, rt.halfA);
        let u = fullscreen(progs.copy);
        bindTex(gl, 0, rt.scene.tex);
        gl.uniform1i(u.uTex, 0);
        drawQuad();
        const r = post.depth.radius / 2;
        u = fullscreen(progs.blur);
        gl.uniform1i(u.uTex, 0);
        bindTarget(gl, rt.halfB);
        bindTex(gl, 0, rt.halfA.tex);
        gl.uniform2f(u.uDir, r / rt.halfA.w, 0);
        drawQuad();
        bindTarget(gl, rt.halfA);
        bindTex(gl, 0, rt.halfB.tex);
        gl.uniform2f(u.uDir, 0, r / rt.halfA.h);
        drawQuad();
        bindTarget(gl, rt.scene);
        u = fullscreen(progs.copy);
        bindTex(gl, 0, rt.halfA.tex);
        drawQuad();
      }

      bindTarget(gl, rt.scene);
      gl.enable(gl.BLEND);
      gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
      const near = post.on.depth && post.depth.near > 0;
      drawLayers(layers.filter((L) => !L.far && !(near && L.near)), t, seed, cam);
      gl.disable(gl.BLEND);
      if (near && layers.some((L) => L.near)) renderNear(t, seed, cam);
    }

    // The layers right by the lens: drawn on their own at half size, then blurred at quarter size,
    // in as many light passes as the blur needs (one wide pass would leave rings), and laid on top.
    function renderNear(t, seed, cam) {
      bindTarget(gl, rt.halfA);
      gl.clearColor(0, 0, 0, 0);
      gl.clear(gl.COLOR_BUFFER_BIT);
      gl.enable(gl.BLEND);
      gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
      drawLayers(layers.filter((L) => L.near), t, seed, cam);
      gl.disable(gl.BLEND);
      bindTarget(gl, rt.quarterA);
      let u = fullscreen(progs.copy);
      bindTex(gl, 0, rt.halfA.tex);
      gl.uniform1i(u.uTex, 0);
      drawQuad();
      // The blur is measured in pixels on a 1080-pixel-tall screen; each pass spreads about 1.63 taps.
      const sigma = (post.depth.near * H) / 1080 / 4;
      const passes = Math.min(32, Math.max(1, Math.ceil((sigma / 1.63) ** 2)));
      const r = sigma / (1.63 * Math.sqrt(passes));
      u = fullscreen(progs.blur);
      gl.uniform1i(u.uTex, 0);
      for (let i = 0; i < passes; i++) {
        bindTarget(gl, rt.quarterB);
        bindTex(gl, 0, rt.quarterA.tex);
        gl.uniform2f(u.uDir, r / rt.quarterA.w, 0);
        drawQuad();
        bindTarget(gl, rt.quarterA);
        bindTex(gl, 0, rt.quarterB.tex);
        gl.uniform2f(u.uDir, 0, r / rt.quarterA.h);
        drawQuad();
      }
      bindTarget(gl, rt.scene);
      gl.enable(gl.BLEND);
      gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
      u = fullscreen(progs.copy);
      bindTex(gl, 0, rt.quarterA.tex);
      drawQuad();
      gl.disable(gl.BLEND);
    }

    function renderBloom() {
      // Down the chain from the scene, then back up, adding each level onto the next.
      let u = fullscreen(progs.down);
      gl.uniform1i(u.uTex, 0);
      let src = rt.scene;
      for (const d of rt.down) {
        bindTarget(gl, d);
        bindTex(gl, 0, src.tex);
        gl.uniform2f(u.uTexel, 1 / src.w, 1 / src.h);
        drawQuad();
        src = d;
      }
      u = fullscreen(progs.up);
      gl.uniform1i(u.uTex, 0);
      gl.uniform1i(u.uBase, 1);
      gl.uniform1f(u.uWeight, post.bloom.radius);
      src = rt.down[rt.down.length - 1];
      for (let i = rt.up.length - 1; i >= 0; i--) {
        bindTarget(gl, rt.up[i]);
        bindTex(gl, 0, src.tex);
        bindTex(gl, 1, rt.down[i].tex);
        gl.uniform2f(u.uTexel, 1 / src.w, 1 / src.h);
        drawQuad();
        src = rt.up[i];
      }
    }

    function renderFinal(clock, frameCount) {
      bindTarget(gl, null);
      const u = fullscreen(progs.final);
      const on = post.on;
      bindTex(gl, 0, rt.scene.tex);
      bindTex(gl, 1, rt.up.length ? rt.up[0].tex : rt.down[0].tex);
      bindTex(gl, 2, rt.down[Math.min(2, rt.down.length - 1)].tex);
      gl.uniform1i(u.uScene, 0);
      gl.uniform1i(u.uBloom, 1);
      gl.uniform1i(u.uHal, 2);
      let norm = 0;
      for (let i = 0; i < bloomLevels; i++) norm += Math.pow(post.bloom.radius, i);
      gl.uniform1f(u.uBloomNorm, norm);
      gl.uniform4f(u.uOn, +on.bloom, +on.halation, +on.grade, +on.ca);
      gl.uniform2f(u.uOn2, +on.vignette, +on.grain);
      gl.uniform1f(u.uGlow, post.bloom.glow);
      gl.uniform1f(u.uThreshold, post.bloom.threshold);
      gl.uniform1f(u.uMist, post.bloom.mist);
      gl.uniform1f(u.uHalAmount, post.halation.amount);
      gl.uniform1f(u.uHalThreshold, post.halation.threshold);
      gl.uniform3f(u.uHalColor, ...rgb(post.halation.color));
      const g = grade;
      gl.uniform1f(u.uExposure, g.exposure);
      gl.uniform1f(u.uTemp, g.temperature);
      gl.uniform1f(u.uTint, g.tint);
      gl.uniform1f(u.uContrast, g.contrast);
      gl.uniform1f(u.uSat, g.saturation);
      gl.uniform1f(u.uWhiteCap, g.whiteCap);
      gl.uniform1f(u.uRedCap, g.redCap);
      gl.uniform1f(u.uSplit, g.split);
      gl.uniform3f(u.uFloor, ...rgb(g.floor));
      gl.uniform3f(u.uShadowTint, ...rgb(g.shadowTint));
      gl.uniform3f(u.uHighTint, ...rgb(g.highlightTint));
      gl.uniform1f(u.uCa, post.ca.amount);
      gl.uniform1f(u.uVig, post.vignette.amount);
      gl.uniform3f(u.uVigColor, ...rgb(post.vignette.color));
      gl.uniform1f(u.uGrain, post.grain.amount);
      gl.uniform1f(u.uGrainSeed, post.grain.perFrame ? frameCount % 997 : clock.beat);
      gl.uniform2f(u.uRes, W, H);
      // A tipsy camera: the frame leans, breathes and doubles, stepping on the beat like the rest.
      // Still while paused, so the editor's clicks land where they look.
      const s = post.on.sway && post.sway && post.motion ? post.sway : null;
      const f = (clock.beatTime || 0) / LB.LOOP;
      const lean = s ? s.amount * 0.03 * (0.7 * Math.sin(TAU * f) + 0.3 * Math.sin(TAU * 3 * f + 1.3)) : 0;
      const zoom = s ? 1 + s.amount * 0.07 + s.amount * 0.012 * Math.sin(TAU * 2 * f + 0.4) : 1;
      gl.uniform4f(u.uSway, lean, zoom, s ? s.ghost * 0.012 * Math.sin(TAU * 4 * f) : 0, s ? s.ghost * 0.004 * Math.cos(TAU * 3 * f) : 0);
      gl.uniform1f(u.uGhost, s ? Math.min(0.5, s.ghost * 0.45) : 0);
      gl.uniform1f(u.uEdge, s && on.bloom ? s.edges : 0);
      drawQuad();
    }

    let frameCount = 0;
    // Returns what was drawn this frame: "scene", "final" or "" (nothing changed).
    function draw(clock) {
      if (!baked) return "";
      frameCount++;
      const beat = clock.beat;
      let drew = "";
      if (dirty || beat !== lastBeat) {
        renderScene(clock);
        if (post.on.bloom || post.on.halation) renderBloom();
        lastBeat = beat;
        drew = "scene";
      }
      if (drew || dirty || (post.on.grain && post.grain.perFrame)) {
        renderFinal(clock, frameCount);
        drew = drew || "final";
      }
      dirty = false;
      return drew;
    }

    // ---------- reading back ----------
    // The last drawn frame, top row first. Call it right after draw(), in the same task.
    function readPixels() {
      const px = new Uint8Array(W * H * 4);
      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
      gl.readPixels(0, 0, W, H, gl.RGBA, gl.UNSIGNED_BYTE, px);
      const out = new Uint8ClampedArray(W * H * 4);
      const row = W * 4;
      for (let y = 0; y < H; y++) out.set(px.subarray((H - 1 - y) * row, (H - y) * row), y * row);
      return new ImageData(out, W, H);
    }

    // Bakes one layer on its own into a small image, for library thumbnails. Straight alpha.
    async function thumbnail(layerDef, w, h, sceneOverride) {
      const prevScene = scene;
      if (sceneOverride) scene = sceneOverride;
      try {
        const L = { ...layerDef, index: layerDef.seed ?? 0 };
        if (L.type === "sparkles") return null;
        await ensureImages([L]);
        ensureMasks([L]);
        await ensurePrograms(paintOf(L).map(progKey));
        // Fit the layer's rect into w x h, centered.
        const r = layerRect(L);
        const rw = r[2] - r[0], rh = r[3] - r[1];
        const k = Math.max(rw / w, rh / h) * 1.08;
        const cx = (r[0] + r[2]) / 2, cy = (r[1] + r[3]) / 2;
        const rect = [cx - (w * k) / 2, cy - (h * k) / 2, cx + (w * k) / 2, cy + (h * k) / 2];
        const t = target(gl, w, h);
        bindTarget(gl, t);
        gl.clearColor(0, 0, 0, 0);
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.enable(gl.BLEND);
        gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
        gl.bindVertexArray(vao);
        paintLayer(L, rect, w, h, 0);
        gl.disable(gl.BLEND);
        const px = new Uint8Array(w * h * 4);
        gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, px);
        freeTarget(gl, t);
        dirty = true;
        // The bake writes row 0 at the top of the rect, so rows are already top first. Undo premultiplication.
        const out = new Uint8ClampedArray(px.length);
        for (let i = 0; i < px.length; i += 4) {
          const a = px[i + 3];
          const m = a ? 255 / a : 0;
          out[i] = px[i] * m; out[i + 1] = px[i + 1] * m; out[i + 2] = px[i + 2] * m; out[i + 3] = a;
        }
        return new ImageData(out, w, h);
      } finally {
        scene = prevScene;
      }
    }

    // Where a layer sits on screen right now, without the per-beat boil nudge (for the editor's overlay).
    function poseOf(id, clock) {
      const L = layers.find((l) => l.id === id);
      if (!L || !post) return null;
      const t = clock.beatTime;
      const p = layerPose(L, t, clock.boilSeed, cameraAt(t), false);
      return { ...p, rect: L.rect, pivot: L.type === "sparkles" ? null : pivotOf(L) };
    }

    // The pose a layer shows at this moment (0 for layers without a pose cycle).
    function frameOf(id, clock) {
      const L = layers.find((l) => l.id === id);
      if (!L || !L.cycle || !post || !post.motion) return 0;
      return Math.floor(clock.beatTime * L.cycle.rate + 1e-6) % L.cycle.frames;
    }

    return {
      gl, resize, setPost, setGrade, invalidate, draw, sync, readPixels, thumbnail, poseOf, frameOf, setView,
      get viewPinned() { return !!viewOverride; },
      bake: (onProgress) => sync(scene, onProgress),
      get size() { return [W, H]; },
      get view() { return view; },
      get density() { return density; },
      get layers() { return layers; },
      get busy() { return !!running; },
    };
  }

  LB.createRenderer = createRenderer;
})();

</script>
<script data-src="js/scenes/garden-art.js">
/*
  The garden study's bespoke art: the pieces too specific to be reusable
  elements (sky, clouds, the hill rows, the central mound and cliffs, the
  waterfall). Trees, bushes, flower clusters, grass and the swaying
  flowers are generic elements (js/elements.js) placed by garden.js.

  The layout comes from measuring the reference frames on a scene-unit
  grid; docs/RECIPE.md has the breakdown and the palette these colors
  start from. Everything is procedural.
*/
(function () {
  const LB = (window.LB = window.LB || {});

  const SKY = `
void main() {
  vec2 p = scenePos();
  float t = p.y + (fbm(p * vec2(2.0, 6.0)) - 0.5) * 0.07;
  vec3 mint = vec3(0.64, 0.85, 0.86);
  vec3 peri = vec3(0.72, 0.78, 0.97);
  vec3 lav  = vec3(0.80, 0.75, 0.98);
  vec3 vio  = vec3(0.86, 0.72, 0.95);
  vec3 c = mix(mint, peri, smoothstep(0.10, 0.28, t));
  c = mix(c, lav, smoothstep(0.26, 0.40, t));
  c = mix(c, vio, smoothstep(0.38, 0.56, t));
  // The glow behind the clouds, top center.
  vec2 g = (p - vec2(0.95, 0.12)) * vec2(0.9, 2.2);
  c = mix(c, vec3(0.86, 0.95, 0.84), exp(-dot(g, g) * 5.0) * 0.55);
  c *= 0.96 + 0.07 * brush(p, 5.0);
  c *= 0.985 + 0.03 * paper(p);
  outColor = vec4(c, 1.0);
}`;

  const CLOUDS = `
float band(float y, float a, float b, float soft) { return smoothstep(a - soft, a, y) * (1.0 - smoothstep(b, b + soft, y)); }
void main() {
  vec2 p = scenePos();
  vec4 acc = vec4(0.0);
  float stroke = 0.8 + 0.2 * brush(p, 7.0);

  // Big periwinkle cloud banks, lit on top, shadowed underneath.
  vec2 q1 = vec2(p.x * 1.3, p.y * 5.0) + vec2(3.0, 0.0);
  float n1 = fbm(q1);
  float n1up = fbm(q1 - vec2(0.0, 0.09));
  float a1 = smoothstep(0.46, 0.6, n1) * band(p.y, 0.18, 0.34, 0.05);
  vec3 c1 = mix(vec3(0.56, 0.58, 0.88), vec3(0.86, 0.87, 1.0), smoothstep(-0.04, 0.07, n1 - n1up));
  over(acc, c1, a1 * 0.95 * stroke);

  // Mint and cream streaks catching the glow.
  vec2 q2 = vec2(p.x * 2.4, p.y * 9.0) + vec2(7.0, 1.0);
  float n2 = fbm(q2);
  float a2 = smoothstep(0.54, 0.66, n2) * band(p.y, 0.09, 0.27, 0.05);
  vec3 c2 = mix(vec3(0.78, 0.93, 0.88), vec3(0.96, 0.98, 0.88), smoothstep(0.6, 0.75, n2));
  over(acc, c2, a2 * 0.9 * stroke);

  // Pink-violet wisps low near the horizon.
  float n3 = vnoise(vec2(p.x * 3.0, p.y * 22.0) + 11.0) * 0.6 + vnoise(vec2(p.x * 7.0, p.y * 40.0)) * 0.4;
  float a3 = smoothstep(0.55, 0.75, n3) * band(p.y, 0.35, 0.45, 0.04);
  over(acc, vec3(0.92, 0.76, 0.93), a3 * 0.6 * stroke);

  outColor = acc;
}`;

  // The horizon: a distant tree line and a pale flower field.
  const HORIZON = `
void main() {
  vec2 p = scenePos();
  vec4 acc = vec4(0.0);
  float horizon = 0.476 + 0.006 * sin(p.x * 7.0);

  // Distant tree line: small round canopies along the horizon, hazy blue-green.
  if (p.x > 0.38 && p.x < 1.40) {
    // Trees stand in loose groups, each sitting on the horizon line.
    float cell = 0.016;
    float i0 = floor(p.x / cell);
    for (int k = -uOne; k <= uOne; k++) {
      float i = i0 + float(k);
      vec2 rnd = hash22(vec2(i, 3.0));
      if (vnoise(vec2(i * 0.18, 4.0)) < 0.42) continue;
      float r = 0.007 + 0.011 * rnd.y;
      vec2 c = vec2((i + 0.5 + 0.3 * (rnd.x - 0.5)) * cell, horizon + 0.003 - r * (0.6 + 0.5 * rnd.x));
      float d = length(p - c) - r + wobble(p, 160.0, 0.004);
      vec3 col = mix(vec3(0.42, 0.58, 0.66), vec3(0.58, 0.54, 0.82), rnd.y) * (0.9 + 0.2 * fuzz(p));
      over(acc, lit(col, vec3((p - c) / r * 0.7, 0.7), 1.0), fill(d));
    }
  }

  // Pale flower field right at the horizon.
  vec3 field = specks(p, vec3(0.82, 0.75, 0.94) * (0.95 + 0.1 * paper(p)), 260.0, 0.6,
                      vec3(0.99, 0.95, 0.99), vec3(0.97, 0.76, 0.88), 0.3);
  over(acc, field, fill(horizon - p.y + wobble(p, 60.0, 0.004)));
  outColor = acc;
}`;

  // Rows of rolling mounds covered in flowers, each closer, darker and more speckled. uN rows.
  const HILLS = `
const vec4 ROW[3] = vec4[3](vec4(0.492, 0.016, 6.3, 1.0), vec4(0.535, 0.026, 4.1, 0.3), vec4(0.60, 0.03, 3.3, 2.0));
const vec3 ROW_DARK[3] = vec3[3](vec3(0.40, 0.36, 0.68), vec3(0.27, 0.25, 0.52), vec3(0.20, 0.20, 0.40));
const vec3 ROW_LIGHT[3] = vec3[3](vec3(0.64, 0.58, 0.90), vec3(0.48, 0.44, 0.80), vec3(0.36, 0.36, 0.68));
const vec3 ROW_SPECK[3] = vec3[3](vec3(0.82, 0.74, 0.99), vec3(0.74, 0.62, 0.96), vec3(0.70, 0.58, 0.95));
const float ROW_SCALE[3] = float[3](46.0, 36.0, 28.0);
void main() {
  vec2 p = scenePos();
  vec4 acc = vec4(0.0);
  for (int r = 0; r < uN; r++) {
    vec4 row = ROW[r];
    float top = row.x + row.y * sin(p.x * row.z + row.w) + row.y * 0.45 * sin(p.x * row.z * 2.7 + row.w * 1.7);
    float d = top - p.y + wobble(p, 35.0, 0.006);
    if (d > 0.01) continue;
    vec3 c = carpet(p, ROW_DARK[r], ROW_LIGHT[r], top, ROW_SCALE[r], ROW_SPECK[r], vec3(0.98, 0.88, 0.96), 0.42 + 0.06 * float(r));
    float a = clamp(0.5 - (d + (fuzz(p) - 0.5) * 3.0 * uPx) / (1.4 * uPx), 0.0, 1.0);
    over(acc, c, a);
  }
  outColor = acc;
}`;

  // The center of the scene, as four paint steps (separate shaders compile in parallel):
  // nearer hills, the rock the water pours over, the mossy mound, the pool.
  const NEAR_HILLS = `
void main() {
  vec2 p = scenePos();
  vec4 acc = vec4(0.0);
  // Nearer indigo hills running in from the left.
  float top = 0.655 + 0.03 * sin(p.x * 4.2 + 0.6) + 0.012 * sin(p.x * 12.0);
  vec3 hill = carpet(p, vec3(0.20, 0.23, 0.46), vec3(0.38, 0.42, 0.76), top, 24.0, vec3(0.70, 0.62, 0.98), vec3(0.99, 0.86, 0.94), 0.5);
  over(acc, hill, fill(top - p.y + wobble(p, 30.0, 0.006)));
  outColor = acc;
}`;

  const ROCK = `
void main() {
  vec2 p = scenePos();
  vec4 acc = vec4(0.0);
  // Rock: behind the waterfall, the cliff to its right, and the rounded rock the small orchid grows from.
  float dR = max(max(1.18 - p.x, p.x - 1.40), 0.531 - p.y);
  dR = smin(dR, max(max(1.372 - p.x, p.x - 1.53), 0.528 - p.y), 0.02);
  dR = smin(dR, sdEllipse(p, vec2(1.49, 0.565), vec2(0.105, 0.06), 0.1), 0.03) + wobble(p, 28.0, 0.007);
  if (dR < 0.01) {
    vec3 rock = clay(p, vec3(0.22, 0.19, 0.36), vec3(0.38, 0.33, 0.55), 1.0 - 0.5 * smoothstep(0.55, 0.85, p.y));
    // Vertical runs and cracks, the way water stains a cliff.
    float run = vnoise(vec2(p.x * 160.0, p.y * 6.0));
    rock *= 0.8 + 0.3 * run;
    rock *= 1.0 - 0.35 * smoothstep(0.7, 0.9, vnoise(vec2(p.x * 70.0 + 5.0, p.y * 3.0)));
    // Moss clinging along the top edge.
    float th;
    vec3 moss = foliage(p, vec3(0.06, 0.12, 0.12), vec3(0.18, 0.34, 0.28), vec3(0.30, 0.50, 0.38), vec3(0.50, 0.70, 0.46), 90.0, th);
    float mossy = (1.0 - smoothstep(0.0, 0.03 + 0.03 * fbm3(p * 20.0), p.y - 0.528)) * smoothstep(0.3, 0.6, th);
    over(acc, mix(rock, moss, mossy), fill(dR));
  }
  outColor = acc;
}`;

  const MOUND = `
void main() {
  vec2 p = scenePos();
  vec4 acc = vec4(0.0);
  // The mound: a big rounded hill of dark, flowered moss, highest at the right where the water starts.
  // Painted after the rock so its rounded right side overlaps it.
  float k = smoothstep(1.25, 0.55, p.x);
  float mTop = 0.535 + 0.085 * k * k + 0.007 * sin(p.x * 26.0) + 0.004 * sin(p.x * 61.0);
  float mRight = p.x - (1.245 + 0.04 * smoothstep(0.55, 0.9, p.y) - 0.03 * (1.0 - smoothstep(0.53, 0.6, p.y)));
  float dM = max(mTop - p.y, mRight) + wobble(p, 30.0, 0.008);
  if (dM < 0.02) {
    float th;
    vec3 moss = foliage(p, vec3(0.05, 0.08, 0.13), vec3(0.15, 0.26, 0.30), vec3(0.27, 0.41, 0.42), vec3(0.48, 0.62, 0.52), 85.0, th);
    // Big soft swells, lit from the top left, so it reads as a hill and not a wall.
    float sw = fbm3(p * vec2(5.0, 7.0));
    float swUp = fbm3((p - vec2(0.012, 0.014)) * vec2(5.0, 7.0));
    moss *= 0.75 + 0.5 * sw + (swUp - sw) * 4.0;
    moss *= mix(vec3(1.0), vec3(0.70, 0.66, 1.0), smoothstep(0.62, 0.92, p.y));
    moss *= 1.0 + 0.25 * (1.0 - smoothstep(0.0, 0.05, p.y - mTop));
    moss = specks(p, moss, 150.0, 0.06, vec3(0.99, 0.90, 0.95), vec3(0.96, 0.66, 0.84), 0.34);
    over(acc, moss, fill(dM - (th - 0.45) * 0.01));
  }
  outColor = acc;
}`;

  const POOL = `
void main() {
  vec2 p = scenePos();
  vec4 acc = vec4(0.0);
  // The pool at the waterfall's foot.
  vec2 pq = (p - vec2(1.165, 0.868)) / vec2(0.18, 0.036);
  float dPool = (length(pq) - 1.0) * 0.036 + wobble(p, 40.0, 0.006);
  vec3 water = mix(vec3(0.32, 0.84, 0.99), vec3(0.10, 0.52, 0.88), smoothstep(0.3, 1.0, length(pq)));
  water *= 0.94 + 0.12 * brush(p, 18.0);
  over(acc, water, fill(dPool));
  outColor = acc;
}`;

  // Baked six times with uFrame 0..5; the frames cycle on the beat.
  const WATERFALL = `
void main() {
  vec2 p = scenePos();
  vec4 acc = vec4(0.0);
  float v = (p.y - 0.53) / 0.31;
  float vc = clamp(v, 0.0, 1.2);
  float xl = 1.272 - 0.135 * pow(vc, 1.5);
  float xr = 1.382 - 0.075 * pow(vc, 1.3);
  float u = (p.x - xl) / (xr - xl);
  float d = max(max(xl - p.x, p.x - xr), max(0.531 - p.y, p.y - 0.862));
  d += wobble(p, 30.0, 0.004);
  float a = fill(d);

  // Streaks travel down one full noise period over the six frames, so the cycle loops.
  float s1 = vnoiseP(vec2(u * 14.0, vc * 3.0 - uFrame * 0.5), vec2(64.0, 3.0));
  float s2 = vnoiseP(vec2(u * 7.0 + 3.0, vc * 2.0 - uFrame / 3.0), vec2(64.0, 2.0));
  vec3 body = mix(vec3(0.10, 0.60, 0.95), vec3(0.22, 0.75, 0.99), sin(clamp(u, 0.0, 1.0) * PI));
  vec3 c = mix(body, vec3(0.50, 0.90, 1.0), smoothstep(0.55, 0.85, s1) * 0.8);
  c = mix(c, vec3(0.72, 0.96, 1.0), smoothstep(0.7, 0.9, s2) * 0.6);
  c = mix(c, vec3(0.78, 0.97, 1.0), (1.0 - smoothstep(0.0, 0.06, v)) * 0.7); // the lip catches the light
  c *= 0.95 + 0.08 * brush(p, 20.0);
  over(acc, c, a);

  // Foam churning where the water lands: a new pattern each frame, like replacement pieces.
  float fy = (p.y - 0.848) / 0.018;
  float foamBand = exp(-fy * fy) * smoothstep(1.06, 1.12, p.x) * (1.0 - smoothstep(1.27, 1.33, p.x));
  float f = fbm3(p * vec2(60.0, 80.0) + vec2(uFrame * 3.7, uFrame * 1.3));
  float fa = smoothstep(0.45, 0.65, f * foamBand + foamBand * 0.25);
  over(acc, lit(vec3(0.90, 0.98, 1.0), vec3((f - 0.5) * 1.5, -0.5, 1.0), 1.0), fa);
  float my = (p.y - 0.83) / 0.03;
  float mist = exp(-my * my) * smoothstep(1.05, 1.12, p.x) * (1.0 - smoothstep(1.28, 1.34, p.x));
  over(acc, vec3(0.94, 0.99, 1.0), mist * (0.18 + 0.12 * fbm3(p * 30.0 + uFrame)));

  // Rings spreading across the pool, one period over the six frames.
  vec2 pq = (p - vec2(1.17, 0.868)) / vec2(0.18, 0.036);
  float inPool = 1.0 - smoothstep(0.85, 1.0, length(pq));
  float ring = sin(length((p - vec2(1.19, 0.85)) * vec2(1.0, 4.0)) * 110.0 - uFrame / 6.0 * 6.2832);
  over(acc, vec3(0.78, 0.96, 1.0), smoothstep(0.75, 1.0, ring) * inPool * 0.45 * step(0.855, p.y));

  outColor = acc;
}`;

  LB.art = LB.art || {};
  LB.art.garden = {
    bakes: { sky: SKY, clouds: CLOUDS, horizon: HORIZON, hills: HILLS, nearHills: NEAR_HILLS, rock: ROCK, mound: MOUND, pool: POOL, waterfall: WATERFALL },
  };
})();

</script>
<script data-src="js/scenes/lilac-art.js">
/*
  Lilac Falls: the bespoke art of the project's own scene (the landing page).

  The garden study recreated the feel of a stop-motion backdrop seen on a
  podcast set. This scene keeps that palette and mood but is laid out from scratch: a
  stepped clay cliff with a two-tier waterfall on the left, a pool that
  runs out into a stream toward the viewer, a blossom tree on the right.

  The water is made the way stop-motion water is made, then animated by
  replacement: every one of the six frames is a new piece, swapped on 2s.
    falls    crinkled cellophane sheets: strips of slightly different blues,
             streaks that step down a notch each frame, and glints that land
             somewhere new each frame; cotton-wool foam and glass-bead spray
             at the foot
    pools    poured resin: deep in the middle, pale at the rim, clear plastic
             ripple rings that grow one step a frame, painted gloss strokes,
             pebbles round the edge
    stream   the same resin, with streaks that step along the current

  Everything is procedural: shader code, no images.
*/
(function () {
  const LB = (window.LB = window.LB || {});

  // ---------- sky: a butter-and-mint glow at the top, periwinkle, lilac, rose at the horizon, a paper moon ----------
  const SKY = `
void main() {
  vec2 p = scenePos();
  float t = p.y + (fbm(p * vec2(2.2, 5.0)) - 0.5) * 0.06;
  vec3 butter = vec3(0.95, 0.94, 0.80);
  vec3 mint = vec3(0.76, 0.90, 0.86);
  vec3 peri = vec3(0.74, 0.77, 0.97);
  vec3 lilac = vec3(0.82, 0.74, 0.97);
  vec3 rose = vec3(0.95, 0.76, 0.90);
  vec3 c = mix(butter, mint, smoothstep(0.0, 0.12, t));
  c = mix(c, peri, smoothstep(0.10, 0.26, t));
  c = mix(c, lilac, smoothstep(0.24, 0.38, t));
  c = mix(c, rose, smoothstep(0.36, 0.52, t));
  // The moon's glow.
  vec2 m = vec2(1.27, 0.22);
  float r = length((p - m) * vec2(1.0, 1.15));
  c = mix(c, vec3(1.0, 0.97, 0.86), exp(-r * r * 22.0) * 0.55);
  c *= 0.965 + 0.06 * brush(p, 5.0);
  c *= 0.985 + 0.03 * paper(p);
  vec4 acc = vec4(c, 1.0);
  // A paper moon: a cream disc, felt-soft at the edge, with a few pressed dimples.
  float dm = r - 0.052 + wobble(p, 90.0, 0.003);
  if (dm < 0.01) {
    vec2 q = (p - m) / 0.052;
    vec3 n = vec3(-q * 0.55, 1.0);
    float dimple = smoothstep(0.55, 0.75, vnoise(p * 70.0)) * 0.12;
    vec3 moon = lit(vec3(1.0, 0.95, 0.80) * (0.96 + 0.06 * fibers(p / uPx * 0.25)) * (1.0 - dimple), n, 1.0);
    over(acc, moon * 1.08, clamp(0.5 - (dm + (fuzz(p) - 0.5) * 2.5 * uPx) / (1.4 * uPx), 0.0, 1.0));
  }
  outColor = acc;
}`;

  // ---------- hills: rows of flowered mounds and a few distant poplars on the horizon ----------
  const HILLS = `
const vec4 ROW[3] = vec4[3](vec4(0.505, 0.014, 5.1, 0.4), vec4(0.548, 0.022, 3.7, 2.2), vec4(0.605, 0.028, 2.9, 4.1));
const vec3 ROW_DARK[3] = vec3[3](vec3(0.44, 0.38, 0.70), vec3(0.31, 0.27, 0.56), vec3(0.22, 0.21, 0.44));
const vec3 ROW_LIGHT[3] = vec3[3](vec3(0.70, 0.62, 0.93), vec3(0.54, 0.47, 0.84), vec3(0.40, 0.38, 0.72));
const vec3 ROW_SPECK[3] = vec3[3](vec3(0.92, 0.80, 0.99), vec3(0.96, 0.74, 0.90), vec3(0.78, 0.64, 0.98));
const float ROW_SCALE[3] = float[3](48.0, 36.0, 27.0);
void main() {
  vec2 p = scenePos();
  vec4 acc = vec4(0.0);
  // Cypresses standing on the farthest row: slim, pointed, a deep hazy blue-violet.
  float horizon = ROW[0].x + ROW[0].y * sin(p.x * ROW[0].z + ROW[0].w);
  float cell = 0.06;
  float i0 = floor(p.x / cell);
  for (int k = -uOne; k <= uOne; k++) {
    float i = i0 + float(k);
    vec2 rnd = hash22(vec2(i, 5.0));
    if (rnd.x < 0.5 || i * cell < 0.75 || i * cell > 1.45) continue;
    float h = 0.03 + 0.03 * rnd.y, w = 0.0065 + 0.003 * rnd.x;
    vec2 base = vec2((i + 0.5) * cell + (rnd.y - 0.5) * 0.02, horizon + 0.006);
    float v = clamp((base.y - p.y) / h, 0.0, 1.0);
    float hwid = w * sqrt(max(1.0 - v, 0.0)) * (0.6 + 0.4 * smoothstep(0.0, 0.25, v));
    float d = max(abs(p.x - base.x) - hwid, max(p.y - base.y, base.y - h - p.y)) + wobble(p, 180.0, 0.002);
    vec3 col = mix(vec3(0.24, 0.30, 0.50), vec3(0.40, 0.46, 0.68), smoothstep(-1.0, 1.0, (base.x - p.x) / max(hwid, 1e-4)));
    col *= 0.9 + 0.2 * fuzz(p);
    over(acc, col, fill(d));
  }
  for (int r = 0; r < 3 * uOne; r++) {
    vec4 row = ROW[r];
    float top = row.x + row.y * sin(p.x * row.z + row.w) + row.y * 0.4 * sin(p.x * row.z * 2.6 + row.w * 1.3);
    float d = top - p.y + wobble(p, 35.0, 0.006);
    if (d > 0.01) continue;
    vec3 c = carpet(p, ROW_DARK[r], ROW_LIGHT[r], top, ROW_SCALE[r], ROW_SPECK[r], vec3(0.99, 0.90, 0.95), 0.40 + 0.06 * float(r));
    float a = clamp(0.5 - (d + (fuzz(p) - 0.5) * 3.0 * uPx) / (1.4 * uPx), 0.0, 1.0);
    over(acc, c, a);
  }
  outColor = acc;
}`;

  // ---------- the cliff: two tiers of painted clay with moss along the top of each ----------
  const CLIFF = `
// The two tiers' outlines, as distances (negative inside). topY is the top edge of the tier the point is on.
float tiers(vec2 p, out float topY) {
  float t1 = 0.300 + 0.006 * sin(p.x * 23.0) + 0.004 * sin(p.x * 57.0);
  float t2 = 0.505 + 0.005 * sin(p.x * 19.0 + 1.0) + 0.003 * sin(p.x * 61.0);
  float r1 = 0.470 + (p.y - 0.30) * 0.16;
  float r2 = 0.715 + (p.y - 0.505) * 0.30;
  float d1 = max(t1 - p.y, p.x - r1);
  float d2 = max(t2 - p.y, p.x - r2);
  topY = p.x < r1 + 0.02 ? t1 : t2;
  return max(smin(d1, d2, 0.012), p.y - 0.815);
}
void main() {
  vec2 p = scenePos();
  vec4 acc = vec4(0.0);
  float topY;
  float d = tiers(p, topY) + wobble(p, 26.0, 0.008);
  if (d > 0.01) { outColor = acc; return; }
  // Stacked clay stones: flat lumps, each pressed by hand, with dark joints between them.
  vec2 tc, id;
  float vd = voronoi(vec2(p.x * 17.0, p.y * 30.0) + uSeed, tc, id);
  float joint = smoothstep(0.42, 0.62, vd);
  vec3 n = normalize(vec3(-tc * vec2(1.1, 1.9), 0.9));
  vec3 alb = mix(vec3(0.27, 0.21, 0.44), vec3(0.54, 0.43, 0.72), 0.15 + 0.7 * id.x);
  alb = mix(alb, vec3(0.50, 0.38, 0.58), step(0.82, id.y) * 0.6); // a few rosier stones
  alb *= 0.88 + 0.24 * fbm3(p * 120.0);
  float under = smoothstep(0.0, 0.07, p.y - topY);
  vec3 rock = lit(alb, n, 0.62 + 0.38 * (1.0 - under * 0.6));
  rock = mix(rock, vec3(0.11, 0.08, 0.18), joint * 0.85);
  rock *= mix(vec3(1.0), vec3(0.74, 0.72, 0.98), smoothstep(0.6, 1.0, p.y));
  // Wet stones where the water runs.
  float w1 = (p.x - 0.40) / 0.065, w2 = (p.x - 0.56) / 0.09;
  float wet = exp(-w1 * w1) * step(p.y, 0.52) + exp(-w2 * w2) * step(0.52, p.y);
  rock = mix(rock, rock * vec3(0.60, 0.76, 0.98) + vec3(0.03, 0.05, 0.08), wet * 0.65);
  // Moss: thick along the top of each tier, and tucked into some of the joints lower down.
  float th;
  vec3 moss = foliage(p, vec3(0.06, 0.12, 0.12), vec3(0.20, 0.38, 0.30), vec3(0.34, 0.56, 0.40), vec3(0.58, 0.78, 0.50), 80.0, th);
  moss = specks(p, moss, 140.0, 0.10, vec3(0.99, 0.84, 0.92), vec3(0.98, 0.95, 0.80), 0.32);
  float band = 0.022 + 0.02 * fbm3(p * vec2(18.0, 6.0));
  float topMoss = (1.0 - smoothstep(band * 0.6, band, p.y - topY)) * smoothstep(0.25, 0.55, th + 0.15);
  float jointMoss = joint * step(0.62, fbm3(p * 9.0 + 4.0)) * smoothstep(0.3, 0.5, th) * (1.0 - wet);
  float mossy = max(topMoss, jointMoss);
  over(acc, mix(rock, moss, mossy), fill(d - topMoss * (th - 0.5) * 0.008));
  outColor = acc;
}`;

  // ---------- the falls: cellophane sheets, cotton foam, bead spray. uN 0 is the upper fall, 1 the lower ----------
  const FALL = `
// Distances to the nearest and second-nearest cell points (for creases between facets), and the nearest cell's id.
vec2 cells(vec2 p, out vec2 id) {
  vec2 n = floor(p), f = fract(p);
  float d1 = 8.0, d2 = 8.0;
  id = vec2(0.0);
  for (int j = -uOne; j <= uOne; j++)
  for (int i = -uOne; i <= uOne; i++) {
    vec2 g = vec2(float(i), float(j));
    vec2 r = g + hash22(n + g) - f;
    float d = dot(r, r);
    if (d < d1) { d2 = d1; d1 = d; id = hash22(n + g + 17.0); }
    else if (d < d2) d2 = d;
  }
  return vec2(sqrt(d1), sqrt(d2));
}
const vec4 FA[2] = vec4[2](vec4(0.400, 0.300, 0.052, 0.512), vec4(0.560, 0.505, 0.078, 0.775)); // center x at the lip, lip y, half width at the lip, foot y
const vec2 FB[2] = vec2[2](vec2(0.066, -0.008), vec2(0.104, 0.02));                               // half width at the foot, lean
void main() {
  vec2 p = scenePos();
  vec4 acc = vec4(0.0);
  vec4 a = FA[uN];
  vec2 b = FB[uN];
  float v = (p.y - a.y) / (a.w - a.y);
  float vc = clamp(v, 0.0, 1.0);
  float cx = a.x + b.y * vc * vc;
  float hw = mix(a.z, b.x, pow(vc, 1.3));
  float u = (p.x - cx) / hw;
  float edgeN = fbm3(vec2(p.y * 40.0, uFrame * 3.1 + float(uN) * 9.0)) - 0.5;
  // The back sheet: a darker layer of cellophane, a little wider, showing at the edges.
  float db = max(abs(p.x - cx) - hw * 1.07, max(a.y - 0.002 - p.y, p.y - a.w)) + edgeN * 0.008;
  over(acc, vec3(0.05, 0.30, 0.60), fill(db) * 0.55);
  // The front sheet, cut a little differently in each replacement frame.
  float d = max(abs(p.x - cx) - hw, max(a.y - 0.004 - p.y, p.y - a.w)) + edgeN * 0.006;
  float fa = fill(d);
  if (fa > 0.0) {
    // Strips of slightly different blues, overlapping like layered sheets.
    float strip = floor((u * 0.5 + 0.5) * 6.0 + (vnoise(vec2(v * 2.5, uFrame + 3.0)) - 0.5) * 0.8);
    float tone = hash12(vec2(strip, float(uN) * 7.0 + 1.0));
    vec3 deep = vec3(0.07, 0.42, 0.78), bright = vec3(0.30, 0.82, 0.98);
    vec3 c = mix(deep, bright, (1.0 - u * u) * (0.7 + 0.3 * tone));
    // Streaks: long and thin, a notch further down each frame (one full period over the six frames).
    float s1 = vnoiseP(vec2(u * 11.0 + strip * 1.7, v * 5.0 - uFrame * (5.0 / 6.0)), vec2(64.0, 5.0));
    float s2 = vnoiseP(vec2(u * 23.0 + 4.0, v * 3.0 - uFrame * 0.5), vec2(64.0, 3.0));
    c = mix(c, vec3(0.56, 0.92, 1.0), smoothstep(0.58, 0.86, s1) * 0.7);
    c = mix(c, vec3(0.86, 0.98, 1.0), smoothstep(0.74, 0.92, s2) * 0.5);
    // Crinkles: stretched facets that catch the light, with pale creases between them. A new crinkle every frame.
    // Each facet is flat, a touch lighter or darker; the creases between them catch the light.
    vec2 id;
    vec2 dd = cells(vec2(u * 2.6, v * 6.0) + hash22(vec2(uFrame, float(uN))) * 40.0, id);
    c *= 0.94 + 0.13 * id.x;
    c = mix(c, vec3(0.84, 0.98, 1.0), (1.0 - smoothstep(0.0, 0.05, dd.y - dd.x)) * 0.28 * (0.5 + id.y));
    c *= 1.06;
    // Glints: short bright slivers running with the water, somewhere new each frame.
    float gl = vnoise(vec2(u * 16.0 + hash12(vec2(uFrame, 9.0)) * 40.0, v * 2.2 + uFrame * 5.0));
    c = mix(c, vec3(1.0), smoothstep(0.86, 0.95, gl) * 0.8);
    // The lip: water curling over the edge, rounded and bright, with a thin shadow under the curl.
    float lip = 1.0 - smoothstep(0.0, 0.09, v);
    c = mix(c, vec3(0.86, 0.99, 1.0) * (0.92 + 0.12 * (1.0 - u * u)), lip * 0.8);
    float curl = exp(-pow((v - 0.10) / 0.025, 2.0));
    c *= 1.0 - 0.18 * curl;
    c *= 0.96 + 0.06 * brush(p, 22.0);
    over(acc, c, fa * (0.88 + 0.1 * (1.0 - u * u)));
  }

  // At the foot: pulled cotton wool, a new arrangement of tufts each frame. The tufts add up into one
  // soft mass (a sum of bumps), shaded as a single surface, so it reads as fluff, not as separate balls.
  float footW = b.x * 1.08;
  vec2 foot = vec2(a.x + b.y, a.w);
  float H = 0.0;
  vec2 G = vec2(0.0);
  for (int k = 0; k < 20 * uOne; k++) {
    float fk = float(k);
    vec2 rnd = hash22(vec2(fk + float(uN) * 13.0, uFrame));
    vec2 rnd2 = hash22(vec2(fk * 1.7 + 3.0, uFrame + float(uN) * 5.0));
    float sx = (fk + rnd.x) / 10.0 - 1.0;
    vec2 c = foot + vec2(sx * footW * 0.95, 0.002 - rnd2.x * footW * 0.30 * (1.0 - 0.7 * abs(sx)));
    float r = footW * (0.10 + 0.09 * rnd.y) * (1.0 - 0.35 * abs(sx));
    vec2 q = (p - c) / vec2(1.35, 0.9);
    float ek = exp(-dot(q, q) / (r * r));
    H += ek;
    G += -2.0 * q / (r * r) * ek / vec2(1.35, 0.9);
  }
  H += (fbm3(p * 150.0 + uFrame * 5.0) - 0.5) * 0.35;
  float foamD = (0.55 - H) * footW * 0.12;
  float foamA = clamp(0.5 - (foamD + (fuzz(p) - 0.5) * 5.0 * uPx) / (1.8 * uPx), 0.0, 1.0);
  if (foamA > 0.0) {
    float fib = fibers(p / uPx * 0.3);
    vec3 n = normalize(vec3(-G * footW * 0.05, 1.0));
    vec3 cotton = lit(vec3(0.95, 0.97, 1.0) * (0.9 + 0.12 * fib), n, 0.75 + 0.25 * clamp(H, 0.0, 1.0));
    cotton = mix(cotton, vec3(0.64, 0.72, 0.95), smoothstep(0.1, 0.8, n.y) * 0.35);
    over(acc, cotton * 1.06, foamA * 0.95);
  }
  // A soft mist over the foam.
  float my = (p.y - (a.w - 0.024)) / 0.03;
  float mist = exp(-my * my) * (1.0 - smoothstep(footW * 0.8, footW * 1.5, abs(p.x - foot.x)));
  over(acc, vec3(0.96, 0.98, 1.0), mist * (0.14 + 0.1 * fbm3(p * 40.0 + uFrame)));
  // Glass-bead spray: a few clear beads in the air, somewhere else each frame.
  for (int k = 0; k < 7 * uOne; k++) {
    vec2 rnd = hash22(vec2(float(k) * 3.1 + float(uN), uFrame * 1.7 + 4.0));
    vec2 c = foot + vec2((rnd.x - 0.5) * footW * 2.2, -0.016 - rnd.y * 0.045);
    float r = 0.0026 + 0.0018 * rnd.y;
    vec2 q = (p - c) / r;
    float bd = (length(q) - 1.0) * r;
    vec3 bead = lit(vec3(0.74, 0.92, 1.0), vec3(-q * 0.8, 0.6), 1.0) + vec3(0.4) * smoothstep(0.45, 0.0, length(q - vec2(-0.35, -0.4)));
    over(acc, bead, fill(bd) * 0.9);
  }
  outColor = acc;
}`;

  // ---------- pools and the stream: poured resin. uN 0 is the ledge pool, 1 the big pool and the stream ----------
  const WATER = `
float body(vec2 p, int n, out float t, out float side) {
  t = 0.0; side = 0.0;
  if (n == 0) return sdEllipse(p, vec2(0.455, 0.511), vec2(0.165, 0.015), 0.0);
  float dp = sdEllipse(p, vec2(0.585, 0.782), vec2(0.235, 0.040), 0.0);
  // The stream leaves the pool's right side and widens toward you.
  vec2 A = vec2(0.74, 0.792), B = vec2(0.88, 0.860), C = vec2(0.99, 1.08);
  float ds = sdBezier(p, A, B, C, t);
  float hw = mix(0.024, 0.105, t * t);
  vec2 q = bez(A, B, C, clamp(t, 0.0, 1.0));
  vec2 q2 = bez(A, B, C, clamp(t + 0.01, 0.0, 1.0));
  vec2 tang = normalize(q2 - q + 1e-6);
  side = dot(p - q, vec2(-tang.y, tang.x)) / hw;
  return smin(dp, ds - hw, 0.03);
}
void main() {
  vec2 p = scenePos();
  vec4 acc = vec4(0.0);
  float t, side;
  float d = body(p, uN, t, side) + wobble(p, 45.0, 0.005);
  if (d > 0.016) { outColor = acc; return; }
  // A dark wet rim, and a few grey pebbles just outside the water.
  vec2 tc, id;
  float pv = voronoi(p * 95.0 + 3.0, tc, id);
  float outside = step(0.0, d);
  float rim = (1.0 - smoothstep(0.0, 0.008, d)) * outside;
  float pebble = step(0.72, id.y) * (1.0 - smoothstep(0.32, 0.44, pv)) * (1.0 - smoothstep(0.006, 0.013, d)) * outside;
  over(acc, vec3(0.14, 0.18, 0.28), rim * 0.6);
  over(acc, lit(mix(vec3(0.52, 0.50, 0.62), vec3(0.78, 0.76, 0.86), id.x), vec3(-tc * 1.6, 0.8), 1.0), pebble);
  float wa = fill(d);
  if (wa <= 0.0) { outColor = acc; return; }
  // Poured resin: pale at the rim, deep in the middle.
  float deep = smoothstep(0.0, uN == 0 ? 0.010 : 0.020, -d);
  vec3 c = mix(vec3(0.50, 0.90, 0.95), vec3(0.08, 0.40, 0.80), deep);
  // The sky's lilac caught along the far edge, the way a glossy surface takes the light.
  vec2 cen = uN == 0 ? vec2(0.455, 0.511) : vec2(0.585, 0.782);
  float farEdge = smoothstep(0.012, 0.0, -d) * step(p.y, cen.y) * (uN == 1 && t > 0.05 ? 0.0 : 1.0);
  c = mix(c, vec3(0.86, 0.82, 1.0), farEdge * 0.55);
  // Under each fall, its light carried into the water.
  vec2 hit = uN == 0 ? vec2(0.398, 0.509) : vec2(0.578, 0.775);
  float under = exp(-pow((p.x - hit.x) / (uN == 0 ? 0.05 : 0.08), 2.0)) * smoothstep(hit.y - 0.004, hit.y + 0.03, p.y) * (1.0 - smoothstep(hit.y + 0.02, hit.y + 0.06, p.y));
  c = mix(c, vec3(0.62, 0.94, 1.0), under * 0.45);
  if (uN == 1 && t > 0.02) {
    // The current: soft streaks along the stream, a step further downstream each frame.
    float s = vnoiseP(vec2(t * 18.0 - uFrame * 0.5, side * 3.0 + 9.0), vec2(3.0, 64.0));
    float s2 = vnoiseP(vec2(t * 30.0 - uFrame * (5.0 / 6.0), side * 7.0), vec2(5.0, 64.0));
    float inStream = smoothstep(0.02, 0.08, t);
    c = mix(c, vec3(0.62, 0.94, 1.0), smoothstep(0.60, 0.88, s) * 0.5 * inStream);
    c = mix(c, vec3(0.92, 1.0, 1.0), smoothstep(0.80, 0.95, s2) * 0.5 * inStream * (1.0 - smoothstep(0.55, 0.95, abs(side))));
    // Foam gathering softly along the banks.
    float bankFoam = smoothstep(0.72, 1.0, abs(side)) * smoothstep(0.45, 0.7, fbm3(vec2(t * 40.0 - uFrame * 0.8, side * 4.0)));
    c = mix(c, vec3(0.93, 0.97, 1.0), bankFoam * 0.7 * inStream);
  }
  // Ripple rings of clear plastic, one step wider each frame, spreading from where the fall lands.
  float e = length((p - hit) / vec2(1.0, uN == 0 ? 0.10 : 0.17));
  float spacing = uN == 0 ? 0.03 : 0.045;
  float ph = e / spacing - uFrame / 6.0;
  float k = floor(ph);
  float ring = 1.0 - smoothstep(0.035, 0.10, abs(fract(ph) - 0.5));
  float ang = atan((p.y - hit.y) / (uN == 0 ? 0.10 : 0.17), p.x - hit.x);
  float broken = smoothstep(0.28, 0.45, vnoise(vec2(ang * 1.6 + k * 2.3, k * 4.1 + 1.0)));
  float ringFade = (1.0 - smoothstep(1.0, uN == 0 ? 4.5 : 5.0, k + uFrame / 6.0)) * step(0.0, k) * (uN == 1 && t > 0.06 ? 0.0 : 1.0);
  c = mix(c, vec3(0.84, 0.98, 1.0), ring * broken * ringFade * 0.6);
  // Gloss: a handful of short painted dashes, in new places each frame.
  for (int g = 0; g < 4 * uOne; g++) {
    vec2 rnd = hash22(vec2(float(g) + float(uN) * 5.0, uFrame + 11.0));
    vec2 gc = cen + (rnd - 0.5) * (uN == 0 ? vec2(0.22, 0.012) : vec2(0.32, 0.05));
    vec2 gq = (p - gc) / vec2(0.012 + 0.01 * rnd.y, 0.0016);
    c = mix(c, vec3(1.0), (1.0 - smoothstep(0.6, 1.0, length(gq))) * 0.8);
  }
  c *= 0.97 + 0.05 * brush(p, 26.0);
  over(acc, c, wa * 0.97);
  outColor = acc;
}`;

  LB.art = LB.art || {};
  LB.art.lilac = { bakes: { lsky: SKY, lhills: HILLS, cliff: CLIFF, fall: FALL, water: WATER } };
})();

</script>
<script data-src="js/scenes/reef-art.js">
/*
  Reef Rave: the bespoke art of an underwater octopus party in a cave.

    cave     deep night water glowing toward the cave mouth, a red wash from
             the upper right and a blue one from the left, and the cave's
             pitted rock framing the top and the left side
    sand     the sea floor, pale where the light pools, with ripples and grit
    lasers   a laser rig: thin beams fanning out from one bright point,
             re-aimed every frame like replacement pieces, some beams
             cutting out, with dust lit up along them
    party    the party's own lights: LED bars washing the room a new color
             every frame, a strobe, and a party light's projected dots
             turning a step at a time
    bulbs    a string of bulbs hanging right in front of the lens, blinking

  The party lights and the bulbs are light, not paint: they're baked with
  no coverage, so they add onto whatever is under them.

  Everything is procedural: shader code, no images.
*/
(function () {
  const LB = (window.LB = window.LB || {});

  // Where the corals glow (x, y, radius) and in which color, so the cave's water carries their light.
  const CAVE = `
const vec3 GLOW_AT[7] = vec3[7](vec3(0.30, 0.15, 0.09), vec3(0.15, 0.35, 0.06), vec3(0.21, 0.50, 0.08), vec3(0.99, 0.39, 0.08),
                                vec3(1.18, 0.25, 0.10), vec3(1.70, 0.45, 0.07), vec3(1.64, 0.17, 0.06));
const vec3 GLOW_COL[7] = vec3[7](vec3(0.30, 0.10, 0.60), vec3(0.50, 0.06, 0.06), vec3(0.14, 0.14, 0.60), vec3(0.50, 0.07, 0.07),
                                 vec3(0.55, 0.16, 0.06), vec3(0.50, 0.06, 0.06), vec3(0.14, 0.14, 0.55));
void main() {
  vec2 p = scenePos();
  // The back of the cave: dim rocky lumps, almost black, far behind the dancers.
  vec2 tc, id;
  float vd = voronoi(p * vec2(16.0, 20.0) + uSeed + 7.0, tc, id);
  vec3 c = vec3(0.020, 0.022, 0.058) * (0.45 + 0.9 * (1.0 - smoothstep(0.15, 0.62, vd))) * (0.75 + 0.5 * id.x);
  // A blue glow around the laser rig, where the cave opens up.
  vec2 g = (p - vec2(0.765, 0.46)) * vec2(0.8, 1.2);
  c += vec3(0.03, 0.07, 0.28) * exp(-dot(g, g) * 9.0);
  // Club light: a red wash from the upper right, a blue one from the left.
  vec2 r = (p - vec2(1.45, 0.30)) * vec2(0.9, 1.2);
  c += vec3(0.22, 0.02, 0.04) * exp(-dot(r, r) * 5.0);
  vec2 bl = (p - vec2(0.40, 0.42)) * vec2(1.0, 1.2);
  c += vec3(0.03, 0.03, 0.16) * exp(-dot(bl, bl) * 8.0);
  // Each coral's own light, soft in the water around it.
  for (int k = 0; k < 7 * uOne; k++) {
    vec3 q = GLOW_AT[k];
    vec2 dq = (p - q.xy) / q.z;
    c += GLOW_COL[k] * exp(-dot(dq, dq) * 2.2) * 0.55;
  }
  c *= 0.9 + 0.16 * fbm(p * vec2(3.0, 5.0) + 2.0);
  vec4 acc = vec4(c, 1.0);
  // The near rock: everything outside the cave's arched opening.
  vec2 o = (p - vec2(0.86, 0.46)) / vec2(0.74, 0.44);
  float d = (1.0 - length(o)) * 0.32 + (fbm3(p * 7.0) - 0.5) * 0.06 + wobble(p, 30.0, 0.01);
  if (d < 0.02) {
    vec2 tc2, id2;
    float v2 = voronoi(p * vec2(22.0, 26.0) + uSeed, tc2, id2);
    float pit = smoothstep(0.38, 0.64, v2);
    vec3 n = normalize(vec3(-tc2 * 0.9, 1.0));
    vec3 alb = mix(vec3(0.17, 0.10, 0.10), vec3(0.40, 0.25, 0.21), id2.x);
    alb = mix(alb, vec3(0.38, 0.20, 0.30), step(0.82, id2.y) * 0.6);
    alb *= 0.8 + 0.35 * fbm3(p * 160.0);
    // Warm light on the rock at the top left, the rest falling into shadow.
    float warm = smoothstep(0.75, 0.0, length(p * vec2(1.0, 1.5)));
    vec3 rock = lit(alb, n, 0.6) * (0.08 + 1.15 * warm);
    rock = mix(rock, vec3(0.012, 0.01, 0.02), pit * 0.8);
    rock += vec3(0.24, 0.02, 0.04) * exp(-dot(r, r) * 3.0) * 0.6 + vec3(0.04, 0.04, 0.20) * exp(-dot(bl, bl) * 5.0) * 0.6;
    for (int k = 0; k < 7 * uOne; k++) {
      vec3 q = GLOW_AT[k];
      vec2 dq = (p - q.xy) / q.z;
      rock += GLOW_COL[k] * exp(-dot(dq, dq) * 2.5) * 0.5;
    }
    // A thin rim of light along the opening's edge.
    rock += vec3(0.08, 0.10, 0.30) * (1.0 - smoothstep(0.0, 0.025, -d)) * 0.5;
    over(acc, rock, fill(d));
  }
  outColor = acc;
}`;

  const SAND = `
void main() {
  vec2 p = scenePos();
  vec4 acc = vec4(0.0);
  float top = 0.615 + 0.012 * sin(p.x * 5.0 + 1.0) + 0.006 * sin(p.x * 17.0);
  float d = top - p.y + wobble(p, 30.0, 0.008);
  if (d > 0.01) { outColor = acc; return; }
  // Pale where the light pools in the middle, sinking into the dark at the back and the sides.
  vec2 q = (p - vec2(0.82, 0.92)) * vec2(0.75, 1.5);
  float pool = exp(-dot(q, q) * 3.6);
  float back = smoothstep(top, top + 0.16, p.y);
  vec3 c = mix(vec3(0.03, 0.04, 0.08), vec3(0.42, 0.52, 0.54), pool * (0.2 + 0.8 * back));
  // Ripples in the sand, and grit.
  float rip = sin((p.y * 90.0 + fbm3(p * 6.0) * 6.0 + p.x * 8.0));
  c *= 0.9 + 0.1 * rip;
  c *= 0.86 + 0.28 * paper(p) * fbm3(p * 200.0);
  c = specks(p, c, 230.0, 0.08 * (0.3 + 0.7 * pool), vec3(0.75, 0.80, 0.82), vec3(0.42, 0.40, 0.48), 0.3);
  // A faint blue from the lasers on the lit sand; the far edge sinks into the dark.
  c += vec3(0.01, 0.02, 0.07) * back;
  c *= 0.25 + 0.75 * smoothstep(top, top + 0.09, p.y);
  vec2 r = (p - vec2(1.55, 0.6)) * vec2(1.0, 1.6);
  c += vec3(0.18, 0.02, 0.04) * exp(-dot(r, r) * 3.0);
  over(acc, c, fill(d));
  outColor = acc;
}`;

  // Baked six times; the rig re-aims its beams every frame, the way a laser show steps.
  const LASERS = `
void main() {
  vec2 p = scenePos();
  vec4 acc = vec4(0.0);
  vec2 E = vec2(0.765, 0.458);
  vec2 v = p - E;
  float dist = length(v);
  for (int k = 0; k < 7 * uOne; k++) {
    float fk = float(k);
    vec2 rnd = hash22(vec2(fk, 3.0));
    // Each beam swings back and forth through the six frames; a few cut out on some frames.
    float base = -2.75 + fk * 0.62 + (rnd.x - 0.5) * 0.3;
    float ang = base + 0.32 * sin(6.2832 * (uFrame / 6.0 + rnd.y));
    float on = step(0.22, hash12(vec2(fk * 7.0, uFrame + 1.0)));
    vec2 dir = vec2(cos(ang), sin(ang));
    float along = dot(v, dir);
    if (along < 0.0 || on < 0.5) continue;
    float across = abs(dot(v, vec2(-dir.y, dir.x)));
    float fade = exp(-along * 0.9);
    vec3 col = mix(vec3(0.25, 0.55, 1.0), vec3(0.35, 0.95, 1.0), rnd.y);
    float core = exp(-across * across / (2.0e-6)) * 1.2;
    float halo = exp(-across * across / (6.0e-5)) * 0.35;
    float a = clamp((core + halo) * fade, 0.0, 1.0);
    over(acc, mix(col, vec3(1.0), core * 0.6), a);
  }
  // The rig itself: a bright point with a soft halo and a little horizontal flare.
  float star = exp(-dist * dist / 1.5e-5) + 0.35 * exp(-dist * dist / 4.0e-4);
  float flare = exp(-abs(v.y) / 0.0015) * exp(-abs(v.x) / 0.05) * 0.5;
  over(acc, vec3(0.78, 0.92, 1.0), clamp(star + flare, 0.0, 1.0));
  // Dust and tiny bubbles lit up in the beams, somewhere new each frame.
  for (int k = 0; k < 10 * uOne; k++) {
    vec2 rnd = hash22(vec2(float(k) * 1.3, uFrame * 2.1 + 5.0));
    vec2 c = E + vec2((rnd.x - 0.5) * 0.5, (rnd.y - 0.3) * 0.25);
    float dd = length(p - c);
    over(acc, vec3(0.6, 0.85, 1.0), exp(-dd * dd / 6.0e-6) * 0.9);
  }
  outColor = acc;
}`;

  // Baked eight times, one color pair per frame; the last frame is the strobe.
  const PARTY = `
const vec3 WASH[8] = vec3[8](vec3(1.0, 0.08, 0.2), vec3(0.8, 0.1, 0.95), vec3(0.15, 0.25, 1.0), vec3(1.0, 0.1, 0.55),
                             vec3(0.55, 0.12, 1.0), vec3(0.1, 0.75, 1.0), vec3(1.0, 0.2, 0.12), vec3(0.85, 0.9, 1.0));
void main() {
  vec2 p = scenePos();
  int f = int(uFrame + 0.5) % 8;
  vec3 a = WASH[f], b = WASH[(f + 3) % 8];
  // LED bars just out of frame at the top corners, each washing its own side of the room.
  vec2 la = (p - vec2(0.0, -0.12)) * vec2(0.75, 1.0);
  vec2 lb = (p - vec2(1.78, -0.12)) * vec2(0.75, 1.0);
  vec3 c = a * exp(-dot(la, la) * 2.0) * 0.34 + b * exp(-dot(lb, lb) * 2.0) * 0.34;
  // Their light pooling on the floor.
  vec2 fl = (p - vec2(0.9, 0.9)) * vec2(0.6, 2.4);
  c += mix(a, b, smoothstep(0.2, 1.6, p.x)) * exp(-dot(fl, fl) * 2.0) * 0.14;
  // A party light's projected dots, turned a step each frame.
  vec2 q = (p - vec2(0.88, 0.5)) * vec2(1.0, 1.5);
  float ang = uFrame * 0.23;
  q = mat2(cos(ang), sin(ang), -sin(ang), cos(ang)) * q;
  vec2 cell = floor(q / 0.07);
  vec2 h = hash22(cell + 3.0);
  vec2 g = fract(q / 0.07) - 0.5 + (h - 0.5) * 0.3;
  float spot = smoothstep(0.2, 0.12, length(g)) * step(0.68, h.x) * exp(-dot(q, q) * 2.2) * smoothstep(0.05, 0.45, p.y);
  vec3 dc = h.y < 0.33 ? vec3(1.0, 0.15, 0.35) : h.y < 0.66 ? vec3(0.25, 1.0, 0.55) : vec3(0.35, 0.45, 1.0);
  c += dc * spot * 0.32;
  if (f == 7) c += vec3(0.2, 0.22, 0.28);
  outColor = vec4(c, 0.0);
}`;

  // Two strings of bulbs, close enough to touch, so they'll be out of focus. Baked four times, blinking.
  const BULBS = `
const vec3 BULB[5] = vec3[5](vec3(1.0, 0.78, 0.45), vec3(1.0, 0.3, 0.6), vec3(0.35, 0.55, 1.0), vec3(1.0, 0.55, 0.15), vec3(0.4, 1.0, 0.55));
void main() {
  vec2 p = scenePos();
  vec3 c = vec3(0.0);
  for (int k = 0; k < 16 * uOne; k++) {
    float fk = float(k);
    // Bulbs 0 to 9 sag across the top left; 10 to 15 hang in from the top right.
    float u = k < 10 ? fk / 9.0 : (fk - 10.0) / 5.0;
    vec2 b = k < 10 ? vec2(-0.08 + u * 1.0, 0.04 + 0.3 * u * (1.0 - u) * 1.4 - 0.04 * u)
                    : vec2(1.38 + u * 0.5, 0.04 + 0.24 * u * (1.0 - u) + 0.06 * u);
    float rad = k < 10 ? 0.042 - 0.01 * u : 0.032 + 0.012 * u;
    float on = hash12(vec2(fk * 3.1, uFrame + 2.0)) > 0.25 ? 1.0 : 0.25;
    float d = length(p - b);
    c += BULB[k % 5] * smoothstep(rad, rad * 0.7, d) * on * 1.5;
  }
  outColor = vec4(c, 0.0);
}`;

  LB.art = LB.art || {};
  LB.art.reef = { bakes: { rcave: CAVE, rsand: SAND, lasers: LASERS, party: PARTY, bulbs: BULBS } };
})();

</script>
<script data-src="js/editor/doc.js">
/*
  The editor's document: a scene file plus the editing state around it.

  A scene file is plain JSON (docs/SCENE-FORMAT.md). It's the same shape the
  study's js/scenes/garden.js uses, plus a few fields the editor adds:
  layer names, hidden/locked flags, offsets, opacity, seeds, item ids and
  item transforms, and an "images" table for pictures the user imported.

  Everything that changes the document goes through ED.change() or
  ED.preview(), so the canvas, the panels, undo and autosave all hear
  about it the same way.
*/
(function () {
  const LB = (window.LB = window.LB || {});
  const FORMAT = "elaborate-backgrounds/scene";
  const VERSION = 1;
  const A = 16 / 9;
  const clone = (o) => JSON.parse(JSON.stringify(o));

  // ---------- look presets ----------
  const BASE_POST = {
    depth: { radius: 1.2, near: 0 },
    bloom: { glow: 0.7, threshold: 0.5, mist: 0.3, radius: 0.85 },
    halation: { amount: 0.4, threshold: 0.55, color: "#FF7340" },
    ca: { amount: 0.0004 },
    vignette: { amount: 0.3, color: "#E0A890" },
    grain: { amount: 0.028, perFrame: false },
    sway: { amount: 0, ghost: 0, edges: 0 },
  };
  const ALL_ON = { depth: true, bloom: true, halation: true, grade: true, ca: true, vignette: true, grain: true, sway: true };

  const PRESETS = {
    warm: {
      name: "Warm dream",
      note: "The garden study's look: gold highlights, rose blacks, plenty of mist.",
      grade: { exposure: 0.2, temperature: 0.6, tint: 0.12, contrast: 1.03, saturation: 1.45, floor: "#2E1A30", whiteCap: 0.98, redCap: 1.0, shadowTint: "#8A4E7E", highlightTint: "#FFE0B0", split: 0.3 },
      post: BASE_POST,
    },
    measured: {
      name: "Measured",
      note: "Matched to the numbers measured from the reference frames: cool, contrasty, little haze.",
      grade: { exposure: -0.22, temperature: -0.15, tint: 0.0, contrast: 1.4, saturation: 1.0, floor: "#13181D", whiteCap: 1.0, redCap: 0.85, shadowTint: "#1C2430", highlightTint: "#FFFFFF", split: 0.1 },
      post: { ...BASE_POST, bloom: { ...BASE_POST.bloom, glow: 0.35, mist: 0.14 }, halation: { ...BASE_POST.halation, amount: 0 }, vignette: { amount: 0.12, color: "#888888" } },
    },
    clean: {
      name: "Clean",
      note: "Almost no grade: the colors you pick, with a little glow and grain.",
      grade: { exposure: 0, temperature: 0, tint: 0, contrast: 1, saturation: 1, floor: "#000000", whiteCap: 1, redCap: 1, shadowTint: "#808080", highlightTint: "#FFFFFF", split: 0 },
      post: { ...BASE_POST, bloom: { ...BASE_POST.bloom, glow: 0.3, mist: 0.08 }, halation: { ...BASE_POST.halation, amount: 0 }, ca: { amount: 0 }, vignette: { amount: 0.12, color: "#555555" }, grain: { amount: 0.02, perFrame: false } },
    },
    sunny: {
      name: "Sunny day",
      note: "Bright and warm: golden highlights, lilac shadows, a soft haze and a little grain.",
      grade: { exposure: 0.1, temperature: 0.3, tint: 0.03, contrast: 1.08, saturation: 1.25, floor: "#382630", whiteCap: 0.985, redCap: 1, shadowTint: "#6E5C96", highlightTint: "#FFE6B8", split: 0.26 },
      post: { depth: { radius: 1.0 }, bloom: { glow: 0.55, threshold: 0.62, mist: 0.24, radius: 0.85 }, halation: { amount: 0.3, threshold: 0.6, color: "#FF8A50" },
        ca: { amount: 0.0004 }, vignette: { amount: 0.26, color: "#E8B088" }, grain: { amount: 0.032, perFrame: false } },
    },
    moonlit: {
      name: "Moonlit",
      note: "A night grade: blue shadows, pale highlights, a cold glow.",
      grade: { exposure: -0.15, temperature: -0.7, tint: 0.06, contrast: 1.12, saturation: 0.85, floor: "#0E1428", whiteCap: 0.94, redCap: 0.9, shadowTint: "#2A3A6A", highlightTint: "#D6E4FF", split: 0.35 },
      post: { ...BASE_POST, bloom: { glow: 0.8, threshold: 0.42, mist: 0.24, radius: 0.85 }, halation: { amount: 0.25, threshold: 0.5, color: "#7FA0FF" }, vignette: { amount: 0.4, color: "#1C2440" } },
    },
  };

  // ---------- ids and names ----------
  const rand36 = () => Math.random().toString(36).slice(2, 7);
  function uid(prefix, taken) {
    let id;
    do id = `${prefix}-${rand36()}`; while (taken && taken.has(id));
    return id;
  }
  const titleCase = (id) => String(id).replace(/[-_]+/g, " ").replace(/^\w/, (c) => c.toUpperCase());

  const ITEM_NAMES = { canopy: "Foliage clump", florets: "Flower cluster", trunk: "Trunk", branch: "Branch", turf: "Grass bank", fuzz: "Felt ball", clay: "3D piece" };
  const SHAPE_NAMES = { rect: "rectangle", ellipse: "ellipse", polygon: "polygon", blob: "blob", path: "cut-out" };
  function itemName(item, doc) {
    if (item.name) return item.name;
    if (item.shader) return `${titleCase(item.shader)} (study art)`;
    if (item.el === "shape" && item.shape === "mask") {
      const im = doc && doc.images[item.image];
      return `Cut-out of ${im ? im.name : "a picture"}`;
    }
    if (item.el === "shape") {
      const kind = item.shape === "polygon" && item.star > 0.05 ? "star" : item.shape === "polygon" && item.sides === 3 ? "triangle" : SHAPE_NAMES[item.shape] || "shape";
      if (item.material === "stripes") return `Striped ${kind}`;
      return `${titleCase(item.material || "paper")} ${kind}`;
    }
    if (item.el === "image") return (doc && doc.images[item.image] && doc.images[item.image].name) || "Image";
    return ITEM_NAMES[item.el] || titleCase(item.el);
  }
  function layerKind(L) {
    if (L.type === "sprite") return L.flower ? titleCase(L.flower) : "Leaf";
    if (L.type === "sparkles") return "Sparkles";
    return "Layer";
  }

  // ---------- creating and checking documents ----------
  // Screen shapes a scene can be made in. Scene units are always 1 tall, so x runs 0 to the aspect.
  const ASPECTS = [
    [16 / 9, "Desktop, 16:9"], [21 / 9, "Ultrawide, 21:9"], [16 / 10, "Laptop, 16:10"], [1, "Square, 1:1"], [9 / 19.5, "Phone, tall"],
  ];
  function blankDoc(aspect = A) {
    const preset = PRESETS.warm;
    return normalize({
      format: FORMAT, version: VERSION,
      title: "Untitled scene",
      aspect, focus: [aspect / 2, 0.5],
      horizon: "#CDB8F5", background: "#1A1420",
      camera: { drift: [0.008, 0.003] },
      fps: 12, boil: 1,
      layers: [
        { id: "backdrop", name: "Backdrop", depth: 0, far: true, boil: 0.4, seed: 1, paint: [
          { el: "shape", shape: "rect", w: aspect + 0.45, h: 1.4, material: "gradient", colors: ["#B9D3EE", "#E6C3E4"], rough: 0, fuzz: 0, puff: 0, shadow: 0, corner: 0, xf: { x: aspect / 2, y: 0.5, s: 1, r: 0 } },
        ] },
      ],
      post: clone(preset.post),
      grades: { warm: clone(preset.grade) },
      grade: "warm",
      images: {},
    }).doc;
  }

  function fromBeach() {
